<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Fan sahifasi</title>
<script src="oyinlar/assets/boot.js"></script>
<link rel="stylesheet" href="oyinlar/assets/theme.css">
<style>
  .top .ttl b { font-size: 15px; font-family: var(--body); font-weight: 700; }
  .page { width: 100%; max-width: 1240px; margin: 0 auto; padding: 28px 20px 50px; }

  /* ---- Masthead ---- */
  .mast { text-align: center; padding: 10px 0 22px; }
  .mast .over { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .mast h1 { font-family: var(--display); font-size: clamp(40px, 8vw, 96px); line-height: .95; margin: 12px 0; letter-spacing: -.01em; }
  .mast .deck { color: var(--muted); max-width: 680px; margin: 0 auto; font-size: 17px; }
  [data-fan="akademik"] .mast { border-bottom: 4px double var(--line-strong); }
  [data-fan="akademik"] .mast .dateline { display: flex; justify-content: space-between; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); padding: 6px 2px; margin-top: 18px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }




  [data-fan="akademik"] .mast .orn { display: none; }

  /* ---- Mustaqil ish (bosh maqola) ---- */
  .lead { display: grid; grid-template-columns: 1fr; gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--line-strong); }
  .lead h2 { font-family: var(--display); font-size: clamp(26px, 3.4vw, 40px); line-height: 1.1; margin: 8px 0 12px; }
  .lead p { color: var(--muted); margin: 0 0 16px; }
  .lead .facts { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); padding-left: 24px; }
  .lead .facts li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  .lead .facts li b { font-family: var(--num); }
  .lead .acts { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---- Oʻyinlar ---- */
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 16px; }
  .sec-h h3 { font-family: var(--display); font-size: clamp(24px, 3vw, 34px); margin: 0; }
  .sec-h span { color: var(--muted); font-size: 14px; }
  .games { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .game { display: flex; flex-direction: column; gap: 10px; padding: 20px 18px 18px; text-decoration: none; min-height: 180px; justify-content: space-between; transition: background .15s; }
  .game .no { font-family: var(--num); font-size: 13px; font-weight: 700; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .game .no svg { width: 30px; height: 30px; color: var(--ink); }
  .game h4 { font-family: var(--display); font-size: 24px; margin: 6px 0 0; line-height: 1.1; }
  .game p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
  .game .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  .game .tags { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  [data-fan="akademik"] .games { border-top: 1px solid var(--line-strong); }
  [data-fan="akademik"] .game { border-right: 1px solid var(--line); }
  [data-fan="akademik"] .game:last-child { border-right: 0; }
  [data-fan="akademik"] .game:hover { background: var(--surface); }
  [data-fan="akademik"] .game .no span b { font-weight: inherit; }
  [data-fan="akademik"] .game .go { text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--accent); }
  /* ---- Tarix: Muzey zali — oʻyinlar eksponat yorliqlari koʻrinishida ---- */
  [data-fan="tarix"] .mast { padding: 26px 0 8px; }
  [data-fan="tarix"] .mast .over { color: var(--accent); letter-spacing: .45em; font-size: 12px; font-weight: 600; }
  [data-fan="tarix"] .mast h1 { font-weight: 500; font-size: clamp(36px, 6.4vw, 80px); line-height: 1.04; margin: 16px auto 12px; max-width: 1100px; letter-spacing: .01em; }
  [data-fan="tarix"] .mast .deck { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  [data-fan="tarix"] .mast .deck b { color: var(--accent); font-weight: 600; }
  [data-fan="tarix"] .mast .orn, [data-fan="tarix"] .mast .art, [data-fan="tarix"] .mast .dateline, [data-fan="tarix"] .lead { display: none; }
  [data-fan="tarix"] .sec-h { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  [data-fan="tarix"] .sec-h h3 { font-weight: 500; letter-spacing: .06em; }
  [data-fan="tarix"] .sec-h span { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
  [data-fan="tarix"] .games { gap: 18px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  [data-fan="tarix"] .game { background: var(--label); color: var(--label-ink); border: 0; border-radius: 1px; min-height: 196px; padding: 18px 18px 16px; box-shadow: var(--shadow); --accent: #9a7636; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
  [data-fan="tarix"] .game:hover { transform: translateY(-6px); }
  [data-fan="tarix"] .game::before { content: attr(data-n); position: absolute; right: 16px; bottom: 4px; font-family: var(--display); font-size: 54px; line-height: 1; color: var(--label-num); pointer-events: none; }
  [data-fan="tarix"] .game .no { color: #6f6758; border-bottom: 1px solid var(--label-ink); padding-bottom: 8px; font-family: var(--body); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; font-weight: 600; }
  [data-fan="tarix"] .game .no span::before { content: "Eksponat · "; }
  [data-fan="tarix"] .tgrid .game .no span::before { content: "Zal · "; }
  [data-fan="tarix"] .game .no span b { font-weight: 600; }
  [data-fan="tarix"] .game .no svg { width: 26px; height: 26px; color: #9a7636; }
  [data-fan="tarix"] .game h4 { position: relative; font-weight: 500; font-size: 22px; letter-spacing: .02em; margin-top: 14px; color: var(--label-ink); }
  [data-fan="tarix"] .game .go { position: relative; color: #9a7636; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  [data-fan="tarix"] .tgrid .game { min-height: 230px; }
  [data-fan="tarix"] .tgrid .game h4 { font-size: 20px; line-height: 1.25; text-transform: none; }
  [data-fan="tarix"] .back-t .btn { background: transparent; }
  [data-fan="akademik"] .mast .art { display: none; }
  .topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px auto 0; max-width: 980px; }
  .topics a { flex: 1 1 300px; max-width: 470px; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; line-height: 1.3; text-align: left; }
  .topics a.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .back-t { margin-top: 18px; }
  .tgrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important; }
  .tgrid .game .no b svg { width: 14px; height: 14px; }
  .tgrid .game h4 { font-size: 22px; line-height: 1.2; }
  .tgrid .game .no small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0 0; }
  @media (max-width: 1100px) { .games { grid-template-columns: repeat(2, 1fr); } [data-fan="akademik"] .game { border-bottom: 1px solid var(--line); } .lead { grid-template-columns: 1fr; } .lead .facts { border-left: 0; padding-left: 0; } }
  @media (max-width: 620px) { .games { grid-template-columns: 1fr; } [data-fan="akademik"] .game { border-right: 0; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Bosh sahifa"><img src="favicon.svg" alt="Bosh sahifa" width="34" height="34"></a>
  <a class="ib" href="index.html"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Fanlar</span></a>
  <div class="ttl"><b id="crumb"></b></div>
  <div class="acts"><button class="ib" id="thm" type="button"></button></div>
</header>
<div class="page" id="page"></div>
<script src="oyinlar/savollar/akademik.js"></script>
<script src="oyinlar/savollar/tarix.js"></script>
<script src="oyinlar/savollar/tarix10.js"></script>
<script src="oyinlar/savollar/tarix11.js"></script>
<script src="oyinlar/savollar/tarix12.js"></script>
<script src="oyinlar/assets/core.js"></script>
<script>
const { icon, esc, fan, data, mavzu, topics } = G;
const MQ = mavzu ? "&mavzu=" + mavzu : "";
// Tarix: mavzu tanlanmagan boʻlsa — avval mavzular sahifasi (alohida tugmalar), tanlangach — shu mavzuning oʻyinlari
const chosen = new URLSearchParams(location.search).has("mavzu");
const landing = topics.length > 1 && !chosen;
const tName = x => x.data.mavzu.replace(/^\d+-mavzu\.\s*/, "");
const tLabel = x => x.k === "bmt" ? "BMT" : x.k + "-mavzu";
const cur = topics.find(x => x.k === mavzu) || topics[0];
G.themeButton(document.getElementById("thm"));
const ROMAN = ["I", "II", "III", "IV", "V"];
const GAMES = [
  { f: "tavakkal", ic: "wheel", t: "Tavakkal", tags: "2–4 jamoa · gʻildirak · tikish", d: "Gʻildirak kategoriyani tanlaydi, savol darajasi (1–5) oldindan koʻrinadi. Har jamoa 500 ballik balansdan tikadi: toʻgʻri javob — tikish qoʻshiladi, xato — ayiriladi." },
  { f: "hududlar", ic: "hex", t: "Hududlar", tags: "2–4 jamoa · xarita · strategiya", d: "Olti burchakli kataklardan iborat xarita. Bazadan boshlab qoʻshni hududlarni egallang, raqibga hujum qiling, poytaxtga yeting." },
  { f: "svetofor", ic: "light", t: "Svetofor", tags: "2–4 jamoa · reaksiya · boshlovchi", d: "Qizil chiroqda chalgʻituvchi tovushlar, yashilda bosish. Boshlovchi kim birinchi bosganini belgilaydi, qizilda bosgan — falstart." },
  { f: "zinapoya", ic: "ladder", t: "Zinapoya", tags: "2–4 jamoa · 10 kategoriya · xavf", d: "Kategoriyani tanlang va 100 dan 500 gacha koʻtariling. Har pogʻonada qaror: davom etish yoki yutuqni saqlash." },
  { f: "arqon", ic: "rope", t: "Arqon tortish" },
  { f: "konvert", ic: "envelope", t: "Sirli konvert", only: "tarix" },
  { f: "afsona", ic: "scroll", t: "Haqiqat yoki afsona", only: "tarix" },
  { f: "minora", ic: "tower", t: "Minora qurish", only: "tarix" },
  { f: "oldin", ic: "updown", t: "Oldinmi, keyinmi?", only: "tarix" },
  { f: "labirint", ic: "maze", t: "Labirint", only: "tarix" },
  { f: "harf", ic: "letters", t: "Harflab topish", only: "tarix" },
  { f: "karvon", ic: "camel", t: "Ipak yoʻli karvoni", only: "tarix" },
  { f: "taxmin", ic: "gauge", t: "Taxmin", only: "tarix" },
  { f: "viselitsa", ic: "gallows", t: "Viselitsa", only: "tarix" },
  { f: "juftlik", ic: "cards", t: "Juftini top", only: "tarix" }
];
// Jonli (real hayotda) oʻtkaziladigan oʻyinlar uchun chop etiladigan materiallar
const JONLI = {
  tarix: [
    { href: "jonli-oyinlar/kim-men.html", ic: "cards", t: "Kim men?" },
    { href: "jonli-oyinlar/josus.html", ic: "spy", t: "Josus" },
    { href: "jonli-oyinlar/bingo.html", ic: "bingo", t: "Tarix bingosi" }
  ],
  // Akademik yozuv: taqdimot (PPTX) — proyektorda koʻrsatiladi
  akademik: [
    { href: "jonli-oyinlar/taqdimot/Kim_men_akademik.pptx", ic: "cards", t: "Kim men?", pptx: true }
  ]
}[fan] || [];
document.title = data.fan;
document.getElementById("crumb").textContent = data.fan;
const ak = fan === "akademik";
document.getElementById("page").innerHTML = `
  <section class="mast">
    <div class="over">${ak ? "Mustaqil ish va interaktiv oʻyinlar" : "Interaktiv oʻyinlar"}</div>
    <div class="orn">${icon("star")}</div>
    <h1>${esc(data.fan)}</h1>
    <div class="deck">${ak ? "Mavzu: Publitsistik nutq uslubi. Publitsistik maqolalar tahlili; “Men tanlagan soha va OAV” mavzusida maqola" : landing ? "" : `<b>${tLabel(cur)}.</b> ${esc(tName(cur))}`}</div>
    ${topics.length > 1 && !landing ? `<div class="back-t"><a class="btn" href="fan.html?fan=${fan}">${icon("back")} Mavzular</a></div>` : ""}
    <div class="art" aria-hidden="true"></div>
    <div class="dateline"><span>Muxamadov Muhammadali</span><span>2026-yil</span><span>Fan oʻqituvchisi: Yunusova Maftuna</span></div>
  </section>
  ${ak ? `<section class="lead">
    <div><div class="kicker">Mustaqil ish</div>
      <h2>Publitsistik nutq uslubi va “Men tanlagan soha va OAV” maqolasi</h2>
      <div class="acts"><a class="btn primary" href="mustaqil-ishlar/akademik-yozuv/index.html">${icon("doc")} Mustaqil ish</a><a class="btn" href="mustaqil-ishlar/akademik-yozuv/loyihalar/detektor.html">Soxta xabar detektori</a><a class="btn" href="mustaqil-ishlar/akademik-yozuv/loyihalar/janrlar.html">Janrlar konstruktori</a><a class="btn" href="mustaqil-ishlar/akademik-yozuv/loyihalar/tozalagich.html">Matn tozalagich</a><a class="btn" href="mustaqil-ishlar/akademik-yozuv/loyihalar/oqish.html">Oʻqish vaqti</a></div></div>
  </section>` : ""}
  ${landing ? `<div class="sec-h"><h3>Mavzular</h3><span>${topics.length} ta mavzu</span></div>
  <div class="games tgrid">${topics.map((x, i) => `
    <a class="game" href="fan.html?fan=${fan}&mavzu=${x.k}" data-n="${x.k === "bmt" ? "I" : x.k}" style="--c:var(--t${i % 4})">
      <div class="no"><span><b>${x.k === "bmt" ? "BMT" : x.k}</b></span></div>
      <h4>${esc(tName(x))}</h4>
      <span class="go">Oʻyinlar ${icon("arrow")}</span>
    </a>`).join("")}</div>` : `
  <div class="sec-h"><h3>Oʻyinlar</h3><span>${data.kategoriyalar.length} kategoriya · ${data.kategoriyalar.length * 5} ta test savoli</span></div>
  <div class="games">${GAMES.filter(g => !g.only || g.only === fan).map((g, i) => `
    <a class="game" href="oyinlar/${g.f}.html?fan=${fan}${MQ}" data-n="${String(i + 1).padStart(2, "0")}" style="--c:var(--t${i % 4})">
      <div class="no"><span><b>${String(i + 1).padStart(2, "0")}</b></span>${icon(g.ic, "")}</div>
      <h4>${g.t}</h4>
      <span class="go">Oʻynash ${icon("arrow")}</span>
    </a>`).join("")}</div>`}
  ${JONLI.length && (ak || landing) ? `<div class="sec-h"><h3>Jonli oʻyinlar</h3><span>Sinfda oʻtkazish uchun</span></div>
  <div class="games jonli">${JONLI.map((g, i) => `
    <a class="game" href="${g.href}"${g.pptx ? " download" : ""} style="--c:var(--t${(i + 2) % 4})">
      <div class="no"><span><b>${String(i + 1).padStart(2, "0")}</b></span>${icon(g.ic, "")}</div>
      <h4>${g.t}</h4>
      <span class="go">${g.pptx ? icon("doc") + " Taqdimot (PPTX)" : icon("print") + " Chop etish"}</span>
    </a>`).join("")}</div>` : ""}
  <footer>Topshiruvchi: Muxamadov Muhammadali</footer>`;
</script>
</body>
</html>
