<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarix dizayni — 14 variant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=Amiri:ital,wght@0,400;0,700;1,700&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=IM+Fell+English:ital@0;1&family=Marcellus&family=Limelight&family=Josefin+Sans:wght@400;600&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #cfc9bd; font-family: "Alegreya Sans", sans-serif; color: #222; }
  .intro { max-width: 1200px; margin: 0 auto; padding: 26px 16px 4px; }
  .intro h1 { margin: 0 0 6px; font-size: 28px; }
  .intro p { margin: 0; color: #444; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .nav a { padding: 6px 10px; background: #222; color: #fff; text-decoration: none; border-radius: 99px; font-size: 13px; }
  .v { max-width: 1200px; margin: 28px auto; padding: 0 16px; }
  .tag { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; flex-wrap: wrap; }
  .tag b { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; background: #222; color: #fff; font-size: 19px; border-radius: 99px; }
  .tag span { font-size: 22px; font-weight: 700; }
  .tag small { color: #444; font-size: 15px; }
  .mock { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 24px 60px -26px rgba(0,0,0,.6); isolation: isolate; }
  .deco { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .bar, .hero, .body { position: relative; z-index: 1; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 22px; font-size: 15px; }
  .bar .nm { flex: 1; font-weight: 700; }
  .bar .bt { padding: 5px 12px; font-size: 13px; border: 1px solid currentColor; opacity: .85; }
  .hero { text-align: center; padding: 30px 20px 24px; }
  .hero .ov { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; }
  .hero h2 { margin: 10px 0 6px; line-height: 1.02; }
  .hero p { margin: 4px 0 0; }
  .body { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; padding: 8px 26px 30px; align-items: start; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cd { position: relative; min-height: 130px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .35s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .cd:hover { transform: translateY(-8px); }
  .cd .no { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  .cd h4 { margin: 4px 0 0; font-size: 23px; line-height: 1.1; }
  .q { position: relative; padding: 20px; }
  .q .m { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
  .q .qt { font-size: 22px; margin: 8px 0 12px; line-height: 1.25; }
  .q .o { display: flex; gap: 10px; align-items: center; padding: 9px 12px; margin-top: 7px; font-size: 15px; }
  .q .o i { font-style: normal; width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; flex: none; }
  @media (max-width: 820px) { .body { grid-template-columns: 1fr; } }

  /* 1 ─ KOSHIN DEVORI */
  .v1 .mock { background: #0e3a7a var(--tile) 0 0/72px 72px; color: #fff; }
  .v1 .bar { background: #0a2a5c; border-bottom: 4px solid #2bb3a7; }
  .v1 .hero { margin: 26px 30px 10px; background: #0a2a5c; border: 6px solid #f3efe4; outline: 4px solid #2bb3a7; box-shadow: 0 0 0 10px #0a2a5c, 0 20px 40px rgba(0,0,0,.5); }
  .v1 .ov { color: #ffd77a; font-family: "Cinzel", serif; }
  .v1 h2 { font-family: "Cinzel", serif; font-weight: 900; font-size: clamp(32px, 5.5vw, 70px); letter-spacing: .04em; color: #f3efe4; text-shadow: 0 3px 0 #2bb3a7; }
  .v1 .hero p { color: #9fe3dc; font-family: "Amiri", serif; font-style: italic; font-size: 19px; }
  .v1 .cd { color: #0a2a5c; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 45%), var(--c); border: 3px solid #f3efe4; border-radius: 10px; box-shadow: inset 0 -8px 16px rgba(0,0,0,.35), inset 0 6px 10px rgba(255,255,255,.4), 0 14px 26px rgba(0,0,0,.45); }
  .v1 .cd h4, .v1 .cd .no { background: #f3efe4; padding: 2px 8px; align-self: flex-start; }
  .v1 .cd h4 { font-family: "Amiri", serif; }
  .v1 .q { background: #f3efe4; color: #0a2a5c; border-radius: 22px; border: 8px solid #2bb3a7; box-shadow: inset 0 0 0 3px #0a2a5c, 0 18px 30px rgba(0,0,0,.45); }
  .v1 .qt { font-family: "Amiri", serif; font-weight: 700; }
  .v1 .o { border-radius: 99px; background: #fff; } .v1 .o i { border-radius: 50%; background: #0e3a7a; color: #fff; }
  .v1 .o.ok { background: #2bb3a7; color: #fff; }

  /* 2 ─ SAMARQAND SHOMI */
  .v2 .mock { background: linear-gradient(180deg, #ffcf8a 0%, #f78f5f 28%, #b14d6f 52%, #4a2a6a 75%, #1c1536 100%); color: #fff6e6; }
  .v2 .sun { position: absolute; left: 50%; top: 150px; width: 220px; height: 220px; margin-left: -110px; border-radius: 50%; background: radial-gradient(circle, #fff2c2, #ffc36b 60%, transparent 70%); animation: pulse 6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .v2 .sil { position: absolute; left: 0; right: 0; top: 210px; height: 160px; }
  .v2 .ov { color: #fff3d6; }
  .v2 h2 { font-family: "Marcellus", serif; font-size: clamp(34px, 6vw, 74px); color: #2a1440; text-shadow: 0 2px 0 rgba(255,255,255,.4); }
  .v2 .hero p { color: #4a2350; font-weight: 700; }
  .v2 .body { margin-top: 150px; }
  .v2 .hero { padding-bottom: 0; }
  .v2 .cd { color: #ffe9c2; background: linear-gradient(180deg, rgba(40,20,70,.6), rgba(20,10,40,.85)); border: 1px solid #ffc36b; border-radius: 80px 80px 12px 12px; box-shadow: 0 0 40px -6px rgba(255,195,107,.6), inset 0 0 30px rgba(255,195,107,.25); text-align: center; align-items: center; }
  .v2 .cd::before { content: ""; position: absolute; top: 22px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: radial-gradient(circle, #fff3c4, #ffb347 55%, transparent 70%); animation: flick 2.2s ease-in-out infinite; }
  @keyframes flick { 30% { opacity: .7; transform: scale(.9); } 60% { opacity: 1; transform: scale(1.1); } }
  .v2 .cd h4 { font-family: "Marcellus", serif; }
  .v2 .q { background: rgba(20,10,40,.75); border: 1px solid #ffc36b; border-radius: 14px; backdrop-filter: blur(6px); }
  .v2 .qt { font-family: "Marcellus", serif; }
  .v2 .o { border: 1px solid rgba(255,195,107,.4); border-radius: 8px; } .v2 .o i { border: 1px solid #ffc36b; border-radius: 50%; }
  .v2 .o.ok { background: #ffc36b; color: #2a1440; }

  /* 3 ─ TEMUR SAROYI (bayroqlar va uch halqa belgisi) */
  .v3 .mock { background: #5a0f16 var(--damask) 0 0/90px 90px; color: #f6e3b0; }
  .v3 .bar { background: #3a080d; border-bottom: 2px solid #d9a73e; }
  .v3 .ov { font-family: "Cinzel", serif; color: #d9a73e; }
  .v3 h2 { font-family: "Cinzel Decorative", serif; font-weight: 900; font-size: clamp(30px, 5vw, 64px); background: linear-gradient(180deg, #fff1c1, #d9a73e 50%, #8f6416 52%, #f0cf75); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #2a0508); }
  .v3 .hero p { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 20px; }
  .v3 .rings { width: 64px; margin: 0 auto 6px; display: block; }
  .v3 .cards { padding-top: 14px; border-top: 6px solid #d9a73e; box-shadow: 0 -2px 0 #3a080d; }
  .v3 .cd { min-height: 170px; color: #3a080d; background: linear-gradient(180deg, #f6e3b0, #e9cf8c); clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%); padding-bottom: 44px; text-align: center; align-items: center; transform-origin: top center; animation: sway 5s ease-in-out infinite; animation-delay: calc(var(--i) * -1.3s); }
  @keyframes sway { 50% { transform: rotate(1.4deg); } }
  .v3 .cd::before { content: ""; position: absolute; inset: 6px 6px auto; height: calc(82% - 6px); border: 1.5px solid #8f1d24; }
  .v3 .cd h4 { font-family: "Cinzel", serif; font-weight: 700; color: #8f1d24; }
  .v3 .q { background: #3a080d; border: 2px solid #d9a73e; outline: 1px solid #d9a73e; outline-offset: -8px; }
  .v3 .qt { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 25px; }
  .v3 .o { border-bottom: 1px solid rgba(217,167,62,.35); } .v3 .o i { border: 1px solid #d9a73e; transform: rotate(45deg); } .v3 .o i b { transform: rotate(-45deg); font-weight: 400; }
  .v3 .o.ok { background: #d9a73e; color: #3a080d; }

  /* 4 ─ MAXFIY ARXIV */
  .v4 .mock { background: #3b2a1e repeating-linear-gradient(92deg, rgba(0,0,0,.08) 0 3px, transparent 3px 11px); color: #2b2218; font-family: "Special Elite", monospace; }
  .v4 .bar { background: #1f160f; color: #e7dcc2; }
  .v4 .hero { margin: 24px auto 6px; max-width: 760px; background: #e9dcbc; padding: 26px; transform: rotate(-1deg); box-shadow: 0 16px 30px rgba(0,0,0,.5); }
  .v4 .hero::after { content: "MAXFIY"; position: absolute; right: 26px; top: 18px; padding: 4px 12px; border: 3px solid #b32020; color: #b32020; font-size: 22px; transform: rotate(12deg); opacity: .85; letter-spacing: .1em; }
  .v4 .ov { color: #6b5a40; letter-spacing: .3em; }
  .v4 h2 { font-size: clamp(28px, 4.6vw, 56px); font-weight: 400; }
  .v4 .cd { background: #d4b27a; border-radius: 3px 8px 3px 3px; box-shadow: 0 10px 20px rgba(0,0,0,.45); transform: rotate(var(--rt)); }
  .v4 .cd:hover { transform: rotate(0) translateY(-8px); }
  .v4 .cd::before { content: ""; position: absolute; left: 0; top: -14px; width: 46%; height: 16px; background: #d4b27a; border-radius: 6px 6px 0 0; }
  .v4 .cd::after { content: ""; position: absolute; right: 18px; top: -10px; width: 14px; height: 40px; border: 3px solid #9aa0a6; border-radius: 8px; }
  .v4 .cd .no { color: #6b4a1c; }
  .v4 .cd h4 { font-size: 22px; font-weight: 400; }
  .v4 .q { background: #f4ecd8; box-shadow: 0 14px 26px rgba(0,0,0,.5); transform: rotate(1deg); }
  .v4 .q::after { content: ""; position: absolute; right: 30px; bottom: 26px; width: 90px; height: 90px; border-radius: 50%; border: 6px solid rgba(110,70,30,.18); }
  .v4 .o i { border: 1px solid #2b2218; } .v4 .o.ok { text-decoration: underline wavy #b32020; } .v4 .o.ok i { background: #b32020; color: #fff; border-color: #b32020; }

  /* 5 ─ MUZEY VITRINASI */
  .v5 .mock { background: #10261f repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 120px); color: #efe6cf; }
  .v5 .bar { border-bottom: 1px solid rgba(201,164,92,.4); }
  .v5 .ov { color: #c9a45c; letter-spacing: .5em; }
  .v5 h2 { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: clamp(34px, 6vw, 76px); }
  .v5 .hero p { color: #a9b8a4; font-style: italic; }
  .v5 .cd { min-height: 170px; justify-content: space-between; align-items: center; text-align: center; background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 45%, rgba(255,255,255,.08)); border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 0 30px rgba(255,255,255,.06); }
  .v5 .cd::before { content: ""; position: absolute; left: 50%; top: -120px; width: 220px; height: 240px; margin-left: -110px; background: radial-gradient(ellipse at 50% 0, rgba(255,240,200,.35), transparent 65%); pointer-events: none; }
  .v5 .cd .art { width: 54px; height: 54px; margin-top: 4px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.6)); }
  .v5 .cd .no { order: 3; margin-top: 6px; padding: 3px 10px; background: linear-gradient(#e2c27e, #a8823e); color: #2a1e08; font-size: 10px; }
  .v5 .cd h4 { order: 2; font-family: "Cormorant Garamond", serif; font-size: 24px; }
  .v5 .q { background: rgba(0,0,0,.35); border: 1px solid rgba(201,164,92,.5); }
  .v5 .qt { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 25px; }
  .v5 .o { border: 1px solid rgba(255,255,255,.15); } .v5 .o i { border: 1px solid #c9a45c; color: #c9a45c; }
  .v5 .o.ok { border-color: #c9a45c; box-shadow: 0 0 20px -4px rgba(201,164,92,.6); }

  /* 6 ─ KARVON YOʻLI (qum barxanlari, yurayotgan karvon) */
  .v6 .mock { background: linear-gradient(180deg, #f8e3b5 0%, #f2c98a 45%, #e3a35f 100%); color: #4a2a12; }
  .v6 .bar { background: rgba(74,42,18,.9); color: #f8e3b5; }
  .v6 .dunes { position: absolute; left: 0; right: 0; top: 200px; height: 260px; }
  .v6 .caravan { position: absolute; top: 236px; left: -260px; width: 260px; animation: walk 26s linear infinite; }
  @keyframes walk { to { transform: translateX(calc(1200px + 260px)); } }
  .v6 .ov { color: #a3471f; font-weight: 700; }
  .v6 h2 { font-family: "Marcellus", serif; font-size: clamp(34px, 6vw, 72px); }
  .v6 .hero p { font-style: italic; }
  .v6 .body { margin-top: 140px; }
  .v6 .cd { min-height: 160px; align-items: center; text-align: center; background: #c98a4f; border-radius: 90px 90px 4px 4px; box-shadow: inset 0 0 0 10px #d9a06a, inset 0 0 0 12px #8a4f22, 0 14px 22px rgba(74,42,18,.35); color: #fff3dc; }
  .v6 .cd::before { content: ""; position: absolute; top: 26px; left: 50%; width: 54px; height: 70px; margin-left: -27px; border-radius: 27px 27px 0 0; background: repeating-linear-gradient(90deg, #6b3a17 0 8px, #5a3013 8px 10px); }
  .v6 .cd h4 { font-family: "Marcellus", serif; margin-top: 70px; }
  .v6 .q { background: #fff3dc; border: 2px solid #8a4f22; border-radius: 4px; box-shadow: 6px 6px 0 #8a4f22; }
  .v6 .qt { font-family: "Marcellus", serif; }
  .v6 .o { border-bottom: 1px dashed #c98a4f; } .v6 .o i { background: #c98a4f; color: #fff; border-radius: 50%; }
  .v6 .o.ok { background: #8a4f22; color: #fff3dc; }

  /* 7 ─ ESKI XARITA (yirtiq chetlar, chizilayotgan yoʻl, sargʻich muhrlar) */
  .v7 .mock { background: #2d2015; padding: 18px; }
  .v7 .paper { position: absolute; inset: 18px; background: #efe0bd radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.4), transparent 60%); -webkit-mask: var(--torn); mask: var(--torn); }
  .v7 .paper::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(120,80,40,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(120,80,40,.12) 1px, transparent 1px); background-size: 70px 70px; }
  .v7 .rose { position: absolute; right: 40px; top: 70px; width: 150px; animation: spin 60s linear infinite; opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .v7 .route { position: absolute; left: 30px; right: 30px; top: 210px; height: 120px; }
  .v7 .route .rt { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: drawR 5s ease forwards infinite; }
  @keyframes drawR { 70%, 100% { stroke-dashoffset: 0; } }
  .v7 .bar { color: #3a2816; border-bottom: 1px dashed #8a6a3a; margin: 0 20px; }
  .v7 .ov { font-family: "IM Fell English", serif; color: #8a2b1a; }
  .v7 h2 { font-family: "IM Fell English", serif; font-weight: 400; font-size: clamp(34px, 6vw, 72px); color: #2e1f10; }
  .v7 .hero p { font-family: "IM Fell English", serif; font-style: italic; color: #5a4024; }
  .v7 .body { margin-top: 100px; }
  .v7 .cd { color: #2e1f10; background: #f7ecd0; border: 1px solid #a8864e; box-shadow: 0 10px 18px rgba(60,40,15,.3); transform: rotate(var(--rt)); }
  .v7 .cd::after { content: ""; position: absolute; right: 14px; top: 14px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d0483a, #8a1b12 70%); box-shadow: 0 0 0 4px rgba(138,27,18,.35); }
  .v7 .cd h4 { font-family: "IM Fell English", serif; font-weight: 400; font-size: 26px; }
  .v7 .cd .no { font-family: "IM Fell English", serif; color: #8a2b1a; }
  .v7 .q { background: #f7ecd0; border: 1px solid #2e1f10; color: #2e1f10; }
  .v7 .qt { font-family: "IM Fell English", serif; font-size: 25px; }
  .v7 .o { border-bottom: 1px dotted #a8864e; } .v7 .o i { border: 1px solid #2e1f10; border-radius: 50%; }
  .v7 .o.ok i { background: #8a1b12; color: #fff; border-color: #8a1b12; } .v7 .o.ok { color: #8a1b12; font-weight: 700; }

  /* 8 ─ QADIMIY TANGALAR (aylanadigan tangalar) */
  .v8 .mock { background: #14183a radial-gradient(circle at 50% 0, #2a3170, transparent 60%); color: #f1e2b6; }
  .v8 .bar { border-bottom: 1px solid rgba(241,226,182,.25); }
  .v8 .ov { color: #c9a24b; }
  .v8 h2 { font-family: "Cinzel", serif; font-weight: 900; font-size: clamp(32px, 5.5vw, 68px); color: #e6c46a; text-shadow: 0 -1px 0 #fff3c4, 0 2px 0 #7a5a16, 0 4px 14px rgba(0,0,0,.6); }
  .v8 .cards { gap: 22px; }
  .v8 .cd { min-height: 0; aspect-ratio: 1; padding: 0; border-radius: 50%; perspective: 800px; background: none; }
  .v8 .cd:hover { transform: none; }
  .v8 .coin { position: absolute; inset: 0; border-radius: 50%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,1.3,.5,1); }
  .v8 .cd:hover .coin { transform: rotateY(180deg); }
  .v8 .face { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; text-align: center; backface-visibility: hidden; background: radial-gradient(circle at 35% 30%, var(--l), var(--m) 55%, var(--d)); box-shadow: inset 0 0 0 8px var(--d), inset 0 0 0 10px var(--l), 0 16px 30px rgba(0,0,0,.6); }
  .v8 .face::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: repeating-conic-gradient(rgba(0,0,0,.25) 0 2deg, transparent 2deg 6deg); -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%); mask: radial-gradient(circle, transparent 66%, #000 67%); }
  .v8 .face.bk { transform: rotateY(180deg); }
  .v8 .face b { font-family: "Cinzel", serif; font-size: 44px; color: var(--d); text-shadow: 0 1px 0 var(--l), 0 -1px 0 rgba(0,0,0,.35); }
  .v8 .face span { font-family: "Cinzel", serif; font-weight: 700; font-size: 17px; color: var(--d); text-shadow: 0 1px 0 var(--l); padding: 0 18px; }
  .v8 .q { background: rgba(0,0,0,.3); border: 2px solid #c9a24b; border-radius: 16px; }
  .v8 .qt { font-family: "Cinzel", serif; font-size: 20px; }
  .v8 .o { border-radius: 99px; border: 1px solid rgba(201,162,75,.35); } .v8 .o i { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, #c9a24b 60%, #7a5a16); color: #3a2a08; }
  .v8 .o.ok { background: rgba(201,162,75,.25); border-color: #c9a24b; }

  /* 9 ─ KINOXRONIKA (sepiya, plyonka, miltillash) */
  .v9 .mock { background: #2a2118; color: #f1e4c8; padding: 0 46px; }
  .v9 .strip { position: absolute; top: 0; bottom: 0; width: 46px; background: #0f0c08 repeating-linear-gradient(180deg, transparent 0 14px, #d8c9a6 14px 26px, transparent 26px 40px) center / 18px 100% no-repeat; }
  .v9 .strip.l { left: 0; } .v9 .strip.r { right: 0; }
  .v9 .grain { position: absolute; inset: 0; z-index: 3; opacity: .18; background-image: radial-gradient(rgba(255,255,255,.5) 1px, transparent 1px); background-size: 3px 3px; animation: flicker .18s steps(2) infinite; mix-blend-mode: overlay; }
  @keyframes flicker { 50% { opacity: .1; transform: translate(1px, -1px); } }
  .v9 .hero { margin: 26px auto 8px; max-width: 760px; border: 3px double #e7cf94; outline: 1px solid #e7cf94; outline-offset: 8px; padding: 22px; }
  .v9 .ov { font-family: "Josefin Sans", sans-serif; color: #e7cf94; }
  .v9 h2 { font-family: "Limelight", serif; font-size: clamp(30px, 5vw, 62px); color: #f6e9c6; }

  if (k === "v11") st.push(`--c:${["#8e1b1b", "#1f3d2a", "#c98a2a", "#2a160e"][i]}`, `--med:${svg(med(["#8e1b1b", "#1f3d2a", "#c98a2a", "#2a160e"][i], "#c98a2a"))}`);
  if (k === "v8") { const m = [["#fff4c2", "#d9b04a", "#7a5a16"], ["#ffffff", "#c9ced6", "#5d636e"], ["#ffd9b3", "#c07a42", "#5e3112"], ["#fff4c2", "#d9b04a", "#7a5a16"]][i]; st.push(`--l:${m[0]};--m:${m[1]};--d:${m[2]}`);
    return `<div class="cd" style="${st.join(";")}"><div class="coin"><div class="face"><b>${["I", "II", "III", "IV"][i]}</b></div><div class="face bk"><span>${g}</span></div></div></div>`; }
  const extra = k === "v5" ? `<svg class="art" viewBox="0 0 24 24" fill="none" stroke="#e2c27e" stroke-width="1.4"><path d="${art[i]}"/></svg>` : "";
  return `<div class="cd" style="${st.join(";")}">${extra}<span class="no">${k === "v5" ? "Eksponat · 0" + (i + 1) : k === "v4" ? "Ish № 0" + (i + 1) : (i + 1) + "-oʻyin"}</span><h4>${g}</h4></div>`;
}).join("");
const opt = (k, l, t, ok) => `<div class="o ${ok ? "ok" : ""}"><i>${k === "v3" ? `<b>${l}</b>` : l}</i>${t}</div>`;

document.getElementById("nav").innerHTML = V.map((v, i) => `<a href="#d${i + 1}">${i + 1}. ${v[0]}</a>`).join("");
document.getElementById("list").innerHTML = V.map(([name, d, k], i) => `
<section class="v ${k}" id="d${i + 1}">
  <div class="tag"><b>${i + 1}</b><span>${name}</span><small>${d}</small></div>
  <div class="mock" style="--tile:${tile};--damask:${damask};--torn:${torn};--suz:${suz};--carve:${carve};--ganch:${ganch};--rose:${rose}">
    <div class="deco">${deco[k] || ""}</div>
    <div class="bar"><span class="nm">Oʻzbekistonning eng yangi tarixi</span><span class="bt">Mavzular</span><span class="bt">Tungi</span></div>
    <div class="hero">${k === "v3" ? rings : ""}
      <div class="ov">Interaktiv oʻyinlar · 12-mavzu</div>
      <h2>Oʻzbekistonning eng yangi tarixi</h2>
      <p>Yangi Oʻzbekistonda amalga oshirilgan islohotlar</p>
    </div>
    <div class="body">
      <div class="cards">${cardsFor(k)}</div>
      <div class="q"><div class="m">Yangi Konstitutsiya · 300 ball</div><div class="qt">Konstitutsiyaviy referendum qachon boʻlib oʻtdi?</div>
        ${opt(k, "A", "1992-yil 8-dekabrda")}${opt(k, "B", "2023-yil 30-aprelda", 1)}${opt(k, "C", "2016-yil 4-dekabrda")}${opt(k, "D", "2021-yil 24-oktabrda")}</div>
    </div>
  </div>
</section>`).join("");
</script>
</body>
</html>
