<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klassik bellashuv</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .award { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
  .aw { padding: 10px; border-radius: 16px; border: 1px solid var(--c); background: var(--glass); }
  .aw .nm { font-weight: 800; color: var(--c); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aw .row-btns { margin-top: 0; }
  .aw .btn { flex: 1; padding: 10px 6px; }
  .aw.done { opacity: .35; pointer-events: none; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="savollar.js"></script>
<script src="assets/oyin.js"></script>
<script>
const { $, $$, esc, store, topic, VALUES, sound } = G;
const SK = G.saveKey("klassik");
let S = store.get(SK);

G.header("Klassik bellashuv", reset);
S && S.teams ? render() : setup();

function setup() {
  G.setup($("#app"), {
    title: "🎯 Klassik bellashuv",
    desc: "Mavzu va narxni tanlang, savolga javob bering. Boshlovchi qaysi jamoa toʻgʻri yoki xato javob berganini belgilaydi.",
    rules: [
      "Jamoalar navbat bilan katak tanlaydi (navbatni boshlovchi kuzatadi).",
      "Javob uchun 30 soniya. Toʻgʻri javob — <b>+narx</b>, xato — <b>−narx</b>. Bir savolga bir nechta jamoa javob berishi mumkin.",
      "Jadvalda yashirin <b>2 ta BONUS ×2</b> katak bor.",
      "Barcha savollar tugagach, eng koʻp ball toʻplagan jamoa gʻolib."
    ],
    onStart(teams) {
      const ids = []; topic.kategoriyalar.forEach((_, c) => VALUES.forEach((_, v) => ids.push(c + "-" + v)));
      S = { teams, used: [], bonus: G.shuffle(ids).slice(0, 2) }; save(); render();
    }
  });
}
function save() { store.set(SK, S); }
function reset() { store.del(SK); S = null; G.modal.close(); setup(); }

function render() {
  $("#app").innerHTML = `
    <div class="board">
      ${topic.kategoriyalar.map(c => `<div class="cat">${c.nomi}</div>`).join("")}
      ${VALUES.map((v, vi) => topic.kategoriyalar.map((_, ci) => { const id = ci + "-" + vi, u = S.used.includes(id);
        return `<button class="cell" data-id="${id}" ${u ? "disabled" : ""}>${u ? "" : v}</button>`; }).join("")).join("")}
    </div>
    <div class="scores" id="sc"></div>`;
  G.scores($("#sc"), S.teams, { onAdjust: (i, d) => { S.teams[i].score += d; save(); render(); } });
  $$(".cell:not(:disabled)").forEach(b => b.onclick = () => open(b.dataset.id));
  if (S.used.length === topic.kategoriyalar.length * VALUES.length) G.winner(S.teams, reset);
}

function open(id) {
  sound.click();
  const [ci, vi] = id.split("-").map(Number), bonus = S.bonus.includes(id), value = VALUES[vi] * (bonus ? 2 : 1);
  if (bonus) {
    sound.bonus();
    const c = G.modal(`<div class="meta"><span class="pill">${topic.kategoriyalar[ci].nomi}</span></div>
      <div class="big">⭐ BONUS ×2 ⭐</div><p style="font-size:20px">Bu savol <b style="color:var(--gold)">${value}</b> ball turadi!</p>
      <div class="row-btns"><button class="btn primary lg" id="go" type="button">Savolni koʻrsatish ▶</button></div>`);
    $("#go", c).onclick = () => show(id, ci, vi, value, bonus);
  } else show(id, ci, vi, value, bonus);
}

function show(id, ci, vi, value, bonus) {
  const item = topic.kategoriyalar[ci].savollar[vi];
  const c = G.modal(`
    <div class="meta"><span class="pill">${topic.kategoriyalar[ci].nomi}</span><span class="pill gold">${value}${bonus ? " · BONUS" : ""}</span></div>
    <div class="q-text">${item.s}</div>
    <div id="tm"></div>
    <div id="ans"></div>
    <div class="row-btns"><button class="btn gold" id="show" type="button">Javobni koʻrsatish</button><button class="btn" id="close" type="button">Yopish ✕</button></div>
    <div class="award">${S.teams.map((t, i) => `<div class="aw" data-i="${i}" style="--c:${t.color}"><div class="nm">${esc(t.name)}</div>
      <div class="row-btns"><button class="btn ok" type="button" data-ok="1">✓ +${value}</button><button class="btn bad" type="button" data-ok="0">✗ −${value}</button></div></div>`).join("")}</div>
    <div class="hint">Probel — javobni koʻrsatish · Esc — yopish</div>`);
  const t = G.timer($("#tm", c), 30, () => {});
  const reveal = () => { if (!$(".answer", c)) $("#ans", c).innerHTML = `<div class="answer">${item.j}</div>${item.izoh ? `<div class="izoh">${item.izoh}</div>` : ""}`; t.stop(); const s = $("#show", c); s && s.remove(); };
  const close = () => { t.stop(); document.removeEventListener("keydown", key); if (!S.used.includes(id)) S.used.push(id); save(); G.modal.close(); render(); };
  const key = e => { if (e.key === " ") { e.preventDefault(); reveal(); } if (e.key === "Escape") close(); };
  document.addEventListener("keydown", key);
  $("#show", c).onclick = reveal; $("#close", c).onclick = close;
  $$(".aw [data-ok]", c).forEach(b => b.onclick = () => {
    const box = b.closest(".aw"), i = +box.dataset.i, ok = b.dataset.ok === "1";
    S.teams[i].score += ok ? value : -value; save(); box.classList.add("done");
    if (ok) { sound.ok(); reveal(); setTimeout(close, 1400); } else sound.bad();
  });
}
</script>
</body>
</html>
