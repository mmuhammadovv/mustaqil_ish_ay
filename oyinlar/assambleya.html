<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>BMT sessiyasi</title>
<script src="assets/boot.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .stage { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, 1fr); gap: 22px; }
  .hallbox { padding: 18px 18px 10px; }
  svg.hall { width: 100%; height: auto; display: block; }
  .seat { transition: fill .5s; }
  .seat.new { animation: seatIn .6s ease; }
  @keyframes seatIn { 0% { r: 2; } 70% { r: 11; } }
  .hall .podium { fill: var(--surface-2); stroke: var(--line-strong); }
  .hall text { font-family: var(--num); fill: var(--muted); }
  .majority { stroke: var(--line-strong); stroke-dasharray: 4 5; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .side .panel { padding: 20px; }
  .session h2 { font-family: var(--display); font-size: clamp(24px, 2.8vw, 32px); margin: 6px 0 6px; }
  .session p { margin: 0; color: var(--muted); }
  .session .steps { display: flex; gap: 4px; margin-top: 14px; }
  .session .steps i { flex: 1; height: 6px; background: var(--surface-2); border-radius: 2px; }
  .session .steps i.done { background: var(--ink); } .session .steps i.cur { background: var(--accent-2); }
  .legend { list-style: none; padding: 0; margin: 10px 0 0; }
  .legend li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .legend .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .legend b { font-family: var(--num); font-size: 18px; }
  .legend .veto { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .legend .veto.on { color: var(--accent); font-weight: 700; }
  .veto-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
  .veto-pick button { padding: 14px; border: 2px solid var(--c); border-radius: var(--r); background: var(--surface); font-weight: 700; }
  .veto-pick button:hover { background: var(--accent-soft); }
  @media (max-width: 960px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="savollar/akademik.js"></script>
<script src="savollar/tarix.js"></script>
<script src="savollar/tarix-qoshimcha.js"></script>
<script src="assets/core.js"></script>
<script>
// Bu oʻyin faqat tarix fani uchun
if (G.fan !== "tarix") location.replace(location.pathname + "?fan=tarix");
const { $, $$, esc, store, data, icon, sound } = G;
const SK = G.saveKey("assambleya"), SEATS = 60, MAJ = 31;
const SESS = ((window.QOSHIMCHA || {}).tarix || {}).sessiyalar || [];
const LEVEL = [0, 1, 2, 2, 3, 4]; // sessiya → savol darajasi (0 — eng oson)
let S = store.get(SK), fresh = [];

G.header("BMT sessiyasi", reset);

function setup() {
  G.setup($("#app"), {
    kicker: "Bosh Assambleya",
    title: "BMT sessiyasi",
    rules: [
      `Zalda <b>${SEATS} ta oʻrin</b> bor. Har bir jamoa — bitta delegatsiya.`,
      `Oʻyin ${SESS.length} ta sessiyadan iborat; har sessiyada har bir delegatsiya bittadan savolga javob beradi. Sessiyalar oʻtgan sari savollar qiyinlashadi.`,
      "Toʻgʻri javob — delegatsiya zaldan oʻrin egallaydi (savol darajasi × 2 ta oʻrin). Boʻsh oʻrin qolmasa, eng koʻp oʻrinli raqibdan olinadi.",
      `<b>${MAJ} ta oʻrin</b> (koʻpchilik) toʻplagan delegatsiyaning rezolyutsiyasi qabul qilinadi — u darhol gʻolib.`,
      "Har delegatsiyada <b>bir martalik veto</b> bor: raqib toʻgʻri javob bersa, veto qoʻyib, uni yana bitta savolga javob berishga majbur qilish mumkin."
    ],
    onStart(teams) {
      teams.forEach(t => { t.score = 0; t.veto = true; });
      S = { teams, sess: 0, turn: 0, used: [] }; save(); render();
    }
  });
}
function save() { store.set(SK, S); }
function reset() { store.del(SK); S = null; G.modal.close(); setup(); }

const empty = () => SEATS - S.teams.reduce((a, t) => a + t.score, 0);
const over = () => S.teams.some(t => t.score >= MAJ) || S.sess >= SESS.length;

function hallSVG() {
  // oʻrinlar: 4 qator, burchak boʻyicha tartiblanadi — har delegatsiya yaxlit blok boʻlib turadi
  const rows = [[10, 92], [14, 124], [16, 156], [20, 188]], pts = [];
  rows.forEach(([n, r]) => { for (let i = 0; i < n; i++) { const a = Math.PI - (i + .5) / n * Math.PI; pts.push({ a, x: 220 + r * Math.cos(a), y: 214 - r * Math.sin(a) }); } });
  pts.sort((p, q) => q.a - p.a);
  const owner = []; S.teams.forEach((t, i) => { for (let k = 0; k < t.score; k++) owner.push(i); });
  const seats = pts.map((p, k) => {
    const o = owner[k];
    return `<circle class="seat ${fresh.includes(k) ? "new" : ""}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="${o === undefined ? "var(--surface-2)" : `var(--t${S.teams[o].c})`}" stroke="var(--line)" stroke-width="1"/>`;
  }).join("");
  return `<svg class="hall" viewBox="0 0 440 236" role="img" aria-label="Zal oʻrinlari">
    <line class="majority" x1="220" y1="14" x2="220" y2="214"/>
    ${seats}
    <path class="podium" d="M190 214a30 30 0 0 1 60 0Z"/>
    <text x="220" y="232" text-anchor="middle" font-size="11">Koʻpchilik: ${MAJ} ta oʻrin</text>
  </svg>`;
}

function render() {
  G.swapped();
  if (over()) return finish();
  const ses = SESS[S.sess], t = S.teams[S.turn];
  $("#app").innerHTML = `
    <div class="stage">
      <div class="panel hallbox">${hallSVG()}</div>
      <div class="side">
        <div class="panel session">
          <div class="kicker">Sessiya ${S.sess + 1} / ${SESS.length}</div>
          <h2>${esc(ses.nomi)}</h2><p>${esc(ses.matn)}</p>
          <div class="steps">${SESS.map((_, k) => `<i class="${k < S.sess ? "done" : k === S.sess ? "cur" : ""}"></i>`).join("")}</div>
        </div>
        <div class="panel" style="--c:${G.tc(t)}">
          <div class="kicker">Soʻz beriladi</div>
          <div class="turn"><span class="who">${esc(t.name)}</span></div>
          <button class="btn primary block lg" id="ask" type="button" style="margin-top:14px">${icon("hall")} Minbarga chiqish</button>
        </div>
        <div class="panel"><div class="kicker">Delegatsiyalar</div>
          <ul class="legend">${S.teams.map(x => `<li style="--c:${G.tc(x)}"><span class="sw"></span><span>${esc(x.name)}</span><span class="veto ${x.veto ? "on" : ""}">${x.veto ? "veto bor" : "veto yoʻq"}</span><b>${x.score}</b></li>`).join("")}
            <li><span class="sw" style="--c:var(--surface-2);border:1px solid var(--line)"></span><span>Boʻsh oʻrinlar</span><span></span><b>${empty()}</b></li></ul></div>
      </div>
    </div>`;
  fresh = [];
  $("#ask").onclick = () => question(S.turn, false);
}

function pickQ() {
  const ses = SESS[S.sess], lv = LEVEL[Math.min(S.sess, LEVEL.length - 1)];
  const pool = G.all().filter(x => !S.used.includes(x.id));
  for (let d = 0; d < 5; d++) {
    let c = pool.filter(x => ses.kat.includes(x.ci) && Math.abs(x.li - lv) === d);
    if (!c.length) c = pool.filter(x => Math.abs(x.li - lv) === d);
    if (c.length) return G.shuffle(c)[0];
  }
  return null;
}

function question(who, vetoed) {
  const q = pickQ(); if (!q) { S.sess = SESS.length; save(); return render(); }
  S.used.push(q.id); save();
  const t = S.teams[who];
  const c = G.modal(`<div class="meta" style="--c:${G.tc(t)}"><span class="tm-name">${esc(t.name)}</span><span>${esc(SESS[S.sess].nomi)}</span><span class="acc">${q.li + 1}-daraja · ${(q.li + 1) * 2} oʻrin</span>${vetoed ? '<span class="acc">Veto — qayta savol</span>' : ""}</div><div id="q"></div>`);
  G.ask($("#q", c), q.item, { onResult(ok) {
    const gain = (q.li + 1) * 2;
    if (ok && !vetoed) {
      const can = S.teams.map((x, i) => i).filter(i => i !== who && S.teams[i].veto);
      if (can.length) return offerVeto(who, gain, can);
    }
    if (ok) award(who, gain);
    else G.toast(`${esc(t.name)}: oʻrin olinmadi`);
    next();
  }});
}

function offerVeto(who, gain, can) {
  const t = S.teams[who];
  const c = G.modal(`<div class="kicker">Veto huquqi</div>
    <h2 style="font-family:var(--display);margin:8px 0">${esc(t.name)} ${gain} ta oʻrin olmoqchi</h2>
    <p style="color:var(--muted)">Biror delegatsiya veto qoʻyadimi? Veto qoʻyilsa, ${esc(t.name)} yana bitta savolga javob beradi. Har delegatsiyada veto bir martalik.</p>
    <div class="veto-pick">${can.map(i => `<button type="button" data-i="${i}" style="--c:${G.tc(S.teams[i])}">${esc(S.teams[i].name)}: veto</button>`).join("")}</div>
    <div class="row-btns"><button class="btn primary lg" id="noveto" type="button">${icon("check")} Rezolyutsiya qoʻllab-quvvatlanadi</button></div>`);
  $$(".veto-pick button", c).forEach(b => b.onclick = () => {
    S.teams[+b.dataset.i].veto = false; save(); sound.foul();
    G.toast(`${esc(S.teams[+b.dataset.i].name)} veto qoʻydi`);
    question(who, true);
  });
  $("#noveto", c).onclick = () => { award(who, gain); next(); };
}

function award(who, gain) {
  const before = S.teams.reduce((a, t) => a + t.score, 0);
  let take = gain;
  const free = Math.min(take, empty()); S.teams[who].score += free; take -= free;
  while (take > 0) {
    const rivals = S.teams.map((x, i) => i).filter(i => i !== who && S.teams[i].score > 0);
    if (!rivals.length) break;
    const top = rivals.sort((a, b) => S.teams[b].score - S.teams[a].score)[0];
    S.teams[top].score--; S.teams[who].score++; take--;
  }
  sound.bonus();
  fresh = Array.from({ length: gain }, (_, k) => before + k);
  G.toast(`${esc(S.teams[who].name)}: +${gain} oʻrin`);
}

function next() {
  G.modal.close();
  S.turn++;
  if (S.turn >= S.teams.length) { S.turn = 0; S.sess++; }
  save(); render();
}

function finish() {
  $("#app").innerHTML = `<div class="panel hallbox">${hallSVG()}</div>`;
  G.winner(S.teams, reset, "oʻrin");
  const top = S.teams.find(t => t.score >= MAJ);
  G.$(".win .sub").textContent = top ? "Rezolyutsiya koʻpchilik ovozi bilan qabul qilindi" : "Sessiyalar yakunlandi — eng koʻp oʻrinli delegatsiya";
}

// Ishga tushirish — barcha funksiya va oʻzgaruvchilar eʼlon qilingandan keyin
S && S.teams ? render() : setup();
</script>
</body>
</html>
