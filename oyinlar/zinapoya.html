<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Zinapoya</title>
<script src="assets/boot.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line-strong); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
  [data-fan="tarix"] .cats { gap: 12px; border: 0; background: transparent; overflow: visible; }
  .cc { position: relative; text-align: left; padding: 18px 16px 16px; min-height: 150px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 8px; transition: background .15s; }
  .cc:nth-child(5n) { border-right: 0; }
  .cc:nth-last-child(-n+5) { border-bottom: 0; }
  [data-fan="tarix"] .cc { border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
  .cc:hover:not(:disabled) { background: var(--accent-soft); }
  .cc .no { font-family: var(--num); font-size: 13px; font-weight: 700; color: var(--accent); }
  .cc .nm { font-family: var(--display); font-size: clamp(17px, 1.8vw, 22px); line-height: 1.15; flex: 1; }
  .cc .ft { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .cc:disabled { cursor: default; background: var(--surface-2); }
  .cc:disabled .nm { color: var(--muted); }
  .cc .stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--c); }
  .cc .steps { display: flex; gap: 3px; }
  .cc .steps i { flex: 1; height: 4px; background: var(--line); }
  .cc .steps i.on { background: var(--c); }
  .round { display: grid; grid-template-columns: 190px 1fr; gap: 26px; }
  .ladder { display: flex; flex-direction: column-reverse; }
  .step { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-bottom: 0; font-family: var(--num); font-size: 15px; color: var(--muted); }
  .step:first-child { border-bottom: 1px solid var(--line); }
  .step.done { color: var(--good); }
  .step.done::after { content: ""; }
  .step.cur { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .bank { margin-top: 14px; padding: 14px; border: 1px solid var(--line-strong); text-align: center; border-radius: var(--r); }
  .bank small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .bank b { font-family: var(--num); font-size: 30px; }
  .helps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .choice { text-align: center; padding: 20px 0; }
  .choice p { color: var(--muted); font-size: 18px; }
  .round .q-text { margin-top: 0; }
  @media (max-width: 900px) { .cats { grid-template-columns: repeat(2, 1fr); } .cc:nth-child(n) { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); } .round { grid-template-columns: 1fr; } .ladder { flex-direction: row-reverse; } .step { flex: 1; justify-content: center; border-bottom: 1px solid var(--line); border-right: 0; } .step span:first-child { display: none; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="savollar/akademik.js"></script>
<script src="savollar/tarix.js"></script>
<script src="assets/core.js"></script>
<script>
const { $, $$, esc, store, data, icon, sound } = G;
const SK = G.saveKey("zinapoya"), VAL = [100, 200, 300, 400, 500];
let S = store.get(SK), R = null;

G.header("Zinapoya", reset);

function setup() {
  G.setup($("#app"), {
    kicker: "Oʻyin 04 · Xavf va qaror",
    title: "Zinapoya",
    desc: `Jamoa ${data.kategoriyalar.length} ta kategoriyadan birini tanlab, beshta pogʻonadan koʻtariladi. Har pogʻonadan keyin qaror qiladi: davom etish yoki yutuqni saqlash.`,
    rules: [
      `Jadvalda <b>${data.kategoriyalar.length} ta kategoriya</b> bor. Jamoalar navbat bilan bittadan tanlaydi.`,
      "Har kategoriyada 5 ta savol: 100, 200, 300, 400, 500 ball.",
      "Toʻgʻri javobdan keyin <b>“Davom etish”</b> yoki <b>“Toʻxtash”</b> — toʻplangan ball saqlanadi.",
      "Xato javob — shu raundda toʻplangan <b>barcha ball yonadi</b>.",
      "Har jamoada bir martalik yordam: <b>50/50</b> va <b>+15 soniya</b>.",
      "Barcha kategoriyalar oʻynalgach, eng koʻp ball toʻplagan jamoa gʻolib."
    ],
    onStart(teams) { S = { teams, played: {}, turn: 0, help: teams.map(() => ({ f: 1, t: 1 })) }; save(); render(); }
  });
}
function save() { store.set(SK, S); }
function reset() { store.del(SK); S = null; R = null; G.modal.close(); setup(); }

function render() {
  G.swapped();
  const t = S.teams[S.turn], cats = data.kategoriyalar;
  if (Object.keys(S.played).length >= cats.length) { $("#app").innerHTML = ""; return G.winner(S.teams, reset); }
  $("#app").innerHTML = `
    <div class="turn" style="--c:${G.tc(t)}"><span class="kicker">Navbat</span><span class="who">${esc(t.name)}</span><span class="what">— kategoriyani tanlang</span></div>
    <div class="cats">${cats.map((c, i) => {
      const p = S.played[i];
      if (p) { const tm = S.teams[p.team]; return `<button class="cc" disabled style="--c:${G.tc(tm)}"><span class="no">${String(i + 1).padStart(2, "0")}</span><span class="nm">${esc(c.nomi)}</span>
        <span class="stamp">${icon(p.kept ? "check" : "cross")} ${esc(tm.name)} · +${p.kept}</span><span class="steps">${VAL.map((_, k) => `<i class="${k < p.steps ? "on" : ""}"></i>`).join("")}</span></button>`; }
      return `<button class="cc" data-c="${i}"><span class="no">${String(i + 1).padStart(2, "0")}</span><span class="nm">${esc(c.nomi)}</span><span class="ft">5 pogʻona · 1500 ballgacha</span></button>`;
    }).join("")}</div>
    <div class="scores" id="sc"></div>`;
  G.scores($("#sc"), S.teams, { active: S.turn, onAdjust: (i, d) => { S.teams[i].score += d; save(); render(); },
    tag: (_, i) => `50/50 ${S.help[i].f ? "bor" : "ishlatilgan"} · +15 s ${S.help[i].t ? "bor" : "ishlatilgan"}` });
  $$(".cc[data-c]").forEach(b => b.onclick = () => { sound.click(); R = { ci: +b.dataset.c, step: 0, bank: 0, team: S.turn }; step(); });
}

function shell(inner) {
  const t = S.teams[R.team];
  return G.modal(`<div class="meta" style="--c:${G.tc(t)};margin-bottom:18px"><span class="tm-name">${esc(t.name)}</span><span>${esc(data.kategoriyalar[R.ci].nomi)}</span><span class="acc">${R.step + 1}-pogʻona</span></div>
    <div class="round"><div><div class="ladder">${VAL.map((v, i) => `<div class="step ${i < R.step ? "done" : i === R.step ? "cur" : ""}"><span>${i + 1}-pogʻona</span><span>${v}</span></div>`).join("")}</div>
      <div class="bank"><small>Raund yutugʻi</small><b>${R.bank}</b></div></div><div>${inner}</div></div>`);
}

function step() {
  const h = S.help[R.team];
  const c = shell(`<div id="q"></div><div class="helps">
    <button class="btn" id="f50" type="button" ${h.f ? "" : "disabled"}>${icon("half")} 50/50</button>
    <button class="btn" id="t15" type="button" ${h.t ? "" : "disabled"}>${icon("clock")} +15 soniya</button></div>`);
  const a = G.ask($("#q", c), data.kategoriyalar[R.ci].savollar[R.step], { onResult: ok => ok ? correct() : finish(0, "Raund yutugʻi yonib ketdi") });
  $("#f50", c).onclick = e => { h.f = 0; save(); a.fifty(); e.currentTarget.disabled = true; };
  $("#t15", c).onclick = e => { h.t = 0; save(); a.timer.add(15); e.currentTarget.disabled = true; };
}

function correct() {
  R.bank += VAL[R.step]; R.step++;
  if (R.step >= VAL.length) { sound.bonus(); return finish(R.bank, "Zinapoya choʻqqisi zabt etildi"); }
  const c = shell(`<div class="choice"><div class="verdict ok">${icon("check")} Toʻgʻri · +${VAL[R.step - 1]}</div>
    <p>Keyingi pogʻona — <b>${VAL[R.step]}</b> ball. Xato qilsangiz, <b>${R.bank}</b> ball yonadi.</p>
    <div class="row-btns"><button class="btn primary lg" id="go" type="button">Davom etish ${icon("arrow")}</button><button class="btn lg" id="stop" type="button">Toʻxtash va ${R.bank} ni saqlash</button></div></div>`);
  $("#go", c).onclick = step;
  $("#stop", c).onclick = () => finish(R.bank, "Ball saqlandi");
}

function finish(kept, msg) {
  const who = R.team;
  S.teams[who].score += kept; S.played[R.ci] = { team: who, steps: R.step, kept };
  S.turn = (S.turn + 1) % S.teams.length; R = null; save();
  G.modal.close(); render(); G.bump($("#sc"), who); G.toast(`${msg}: +${kept}`, 2200);
}

// Ishga tushirish — barcha funksiya va oʻzgaruvchilar eʼlon qilingandan keyin
S && S.teams ? render() : setup();
</script>
</body>
</html>
