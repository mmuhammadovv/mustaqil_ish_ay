<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>Svetofor</title>
<script src="assets/boot.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .progress { display: flex; gap: 3px; }
  .progress i { flex: 1; height: 5px; background: var(--surface-2); border-radius: 1px; }
  .progress i.done { background: var(--ink); } .progress i.cur { background: var(--accent); }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 22px; align-items: start; }
  .qcard { padding: clamp(18px, 3vw, 32px); }
  .qcard.armed .opt { opacity: .55; }
  .tower { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .light { width: 150px; padding: 16px; border-radius: 26px; background: #1a1a1a; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 3px #2c2c2c, 0 20px 40px -20px rgba(0,0,0,.6); }
  [data-fan="tarix"] .light { background: #0d1a2c; box-shadow: inset 0 0 0 3px #1f3352, 0 20px 40px -20px rgba(0,0,0,.6); }
  .lamp { aspect-ratio: 1; border-radius: 50%; background: #2b2b2b; box-shadow: inset 0 6px 14px rgba(0,0,0,.6); transition: background .06s, box-shadow .06s; }
  .lamp.r.on { background: radial-gradient(circle at 40% 35%, #ff8a7a, #d62d1a 60%); box-shadow: 0 0 40px #e23b25, inset 0 -6px 12px rgba(0,0,0,.3); }
  .lamp.y.on { background: radial-gradient(circle at 40% 35%, #ffe08a, #e0a512 60%); box-shadow: 0 0 34px #e0a512; }
  .lamp.g.on { background: radial-gradient(circle at 40% 35%, #a6f5b8, #1fa74a 60%); box-shadow: 0 0 46px #22b552, inset 0 -6px 12px rgba(0,0,0,.3); }
  .state { font-family: var(--display); font-size: 22px; text-align: center; min-height: 1.3em; }
  .state.g { color: var(--good); } .state.r { color: var(--bad); }
  .host { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .host .kicker { margin: 0; }
  .host .tip { color: var(--muted); font-size: 14px; }
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .lane { position: relative; padding: 18px 16px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface); text-align: left; overflow: hidden; min-height: 112px; transition: transform .08s, background .2s, opacity .2s; }
  .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); }
  .lane .nm { font-weight: 700; font-size: 18px; }
  .lane .act { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .lane .st { font-size: 13px; margin-top: 8px; min-height: 1.4em; font-weight: 600; }
  .lane .sc { position: absolute; right: 14px; bottom: 12px; font-family: var(--num); font-size: 26px; font-weight: 600; }
  .lane:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
  .lane:active:not(:disabled) { transform: scale(.98); }
  .lane:disabled { cursor: default; }
  .lane.win { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
  .lane.foul { opacity: .45; }
  .lane.foul .st { color: var(--bad); }
  .lanes.red .lane:not(.foul) { border-color: var(--bad); }
  .ctrl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .react { font-size: 14px; color: var(--muted); }
  @media (max-width: 800px) { .stage { grid-template-columns: 1fr; } .tower { flex-direction: row; justify-content: center; } .light { flex-direction: row; width: auto; } .lamp { width: 52px; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="savollar/akademik.js"></script>
<script src="savollar/tarix.js"></script>
<script src="assets/core.js"></script>
<script>
const { $, $$, esc, store, data, icon, sound } = G;
const SK = G.saveKey("svetofor"), FOUL = 50, ANSWER = 30, WAIT = 10;
let S = store.get(SK), Q = null;

G.header("Svetofor", reset);

function setup() {
  let count = 12;
  G.setup($("#app"), {
    kicker: "Oʻyin 03 · Reaksiya",
    title: "Svetofor",
    desc: "Savol oʻqiladi, keyin svetofor yonadi. Qizil — kutish, yashil — bosish! Jamoalar oʻz tugmalarini bosadi, boshlovchi esa ekranda kim birinchi bosganini belgilaydi.",
    extra: `<span class="l">Savollar soni</span>
      <div class="seg" id="cnt">${[8, 12, 16, 20].map(n => `<button type="button" data-c="${n}" >${n}</button>`).join("")}</div>`,
    rules: [
      "Har bir jamoaga <b>alohida tugma</b> beriladi. Kompyuterni faqat boshlovchi boshqaradi.",
      "Boshlovchi savol va variantlarni oʻqiydi, soʻng <b>“Svetoforni yoqish”</b>ni bosadi. Avval <b>qizil</b> chiroq yonadi.",
      "Yashil chiroq <b>2 dan 10 soniyagacha</b> tasodifiy vaqtda yonadi. Qizil paytida <b>chalgʻituvchi tovushlar</b> eshitiladi — ularga aldanmang!",
      `Qizilda tugma bosgan jamoa — <b>falstart</b>: boshlovchi uni belgilaydi, jamoa −${FOUL} ball oladi va bu savolga javob bera olmaydi.`,
      `Yashil yonganda boshlovchi <b>birinchi bosgan jamoani</b> ekranda tanlaydi. Javob uchun ${ANSWER} soniya. Toʻgʻri — <b>+daraja×100</b>, xato — <b>−daraja×50</b>.`
    ],
    bind(el) {
      const sync = () => $$("#cnt button", el).forEach(x => x.classList.toggle("on", +x.dataset.c === count));
      $$("#cnt button", el).forEach(b => b.onclick = () => { count = +b.dataset.c; sync(); });
      sync();
    },
    onStart(teams) {
      const pool = G.shuffle(G.all()).slice(0, count).sort((a, b) => a.li - b.li).map(x => x.id);
      S = { teams, list: pool, idx: 0 }; save(); render();
    }
  });
}
function save() { store.set(SK, S); }
function reset() { stop(); store.del(SK); S = null; Q = null; G.modal.close(); setup(); }
function stop() { if (Q) { (Q.timers || []).forEach(clearTimeout); Q.t && Q.t.stop(); } }
function later(fn, ms) { const id = setTimeout(fn, ms); Q.timers.push(id); return id; }

function render() {
  G.swapped(); stop();
  if (S.idx >= S.list.length) { $("#app").innerHTML = ""; Q = null; return G.winner(S.teams, reset); }
  const [ci, li] = S.list[S.idx].split("-").map(Number), item = data.kategoriyalar[ci].savollar[li];
  const opts = G.shuffle([item.j, ...item.x]);
  Q = { item, opts, right: opts.indexOf(item.j), value: (li + 1) * 100, out: [], wrongOpts: [], phase: "read", who: -1, timers: [] };
  $("#app").innerHTML = `
    <div class="progress">${S.list.map((_, k) => `<i class="${k < S.idx ? "done" : k === S.idx ? "cur" : ""}"></i>`).join("")}</div>
    <div class="stage">
      <div class="panel qcard" id="qc">
        <div class="meta"><span>Savol ${S.idx + 1} / ${S.list.length}</span><span>${esc(data.kategoriyalar[ci].nomi)}</span><span class="acc">${li + 1}-daraja · ${Q.value} ball</span></div>
        <div class="q-text">${item.s}</div>
        <div id="tm"></div>
        <div class="opts">${opts.map((o, k) => `<button type="button" class="opt" data-k="${k}" disabled><span class="k">${"ABCD"[k]}</span><span>${o}</span></button>`).join("")}</div>
        <div id="after"></div>
        <div class="ctrl" style="margin-top:18px">
          <span class="react" id="react">Savol va variantlarni oʻqing, soʻng svetoforni yoqing</span>
          <span><button class="btn" id="skip" type="button">Oʻtkazib yuborish</button> <button class="btn primary lg" id="arm" type="button">${icon("light")} Svetoforni yoqish</button></span>
        </div>
      </div>
      <div class="tower"><div class="light"><div class="lamp r"></div><div class="lamp y"></div><div class="lamp g"></div></div><div class="state" id="st"></div></div>
    </div>
    <div class="host"><span class="kicker">Boshlovchi paneli</span><span class="tip" id="tip">Qizilda bosgan jamoani — falstart, yashilda birinchi bosganini — javob beruvchi sifatida belgilang</span></div>
    <div class="lanes" id="lanes">${S.teams.map((t, i) => `<button class="lane" type="button" data-i="${i}" style="--c:${G.tc(t)}"><div class="nm">${esc(t.name)}</div><div class="act"></div><div class="st"></div><div class="sc">${t.score}</div></button>`).join("")}</div>`;
  $("#arm").onclick = arm;
  $("#skip").onclick = () => reveal(null, "Savol oʻtkazib yuborildi");
  $$(".lane").forEach(b => b.onclick = () => press(+b.dataset.i));
  $$(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  lanes();
}

/* Boshlovchi tugmalarining holati: qaysi bosqichda nima qiladi */
function lanes() {
  const ph = Q.phase;
  $("#lanes").classList.toggle("red", ph === "red");
  $$(".lane").forEach((l, i) => {
    const out = Q.out.includes(i);
    l.disabled = out || !(ph === "red" || ph === "green");
    l.querySelector(".act").textContent = out ? "" : ph === "red" ? "Bosdi → falstart" : ph === "green" ? "Birinchi bosdi → javob beradi" : "";
  });
}
function lamps(r, y, g) { $(".lamp.r").classList.toggle("on", r); $(".lamp.y").classList.toggle("on", y); $(".lamp.g").classList.toggle("on", g); }
function laneState(i, txt, cls) { const l = $$(".lane")[i]; l.querySelector(".st").textContent = txt; if (cls) l.classList.add(cls); }

function arm() {
  if (!Q || Q.phase !== "read") return;
  $("#arm").disabled = true; $("#qc").classList.add("armed");
  Q.phase = "red"; lamps(true, false, false); sound.red(); lanes();
  $("#st").textContent = "Kuting"; $("#st").className = "state r";
  $("#react").textContent = "Qizil! Hali bosmang…";
  const delay = 2000 + Math.random() * 8000;
  // chalgʻituvchi tovushlar: yashil signalga oʻxshash, lekin chiroq hali qizil
  const n = delay > 4000 ? 1 + Math.floor(Math.random() * 3) : Math.random() < .6 ? 1 : 0;
  for (let k = 0; k < n; k++) later(() => { if (Q.phase === "red") sound.decoy(); }, 700 + Math.random() * (delay - 1200));
  later(() => {
    if (Q.phase !== "red") return;
    Q.phase = "green"; lamps(false, false, true); sound.green(); lanes();
    $("#st").textContent = "Bosing!"; $("#st").className = "state g";
    $("#react").textContent = "Yashil! Birinchi bosgan jamoani belgilang";
    later(() => { if (Q.phase === "green") reveal(null, "Hech kim bosmadi"); }, WAIT * 1000);
  }, delay);
}

function press(i) {
  if (!Q || !S.teams[i] || Q.out.includes(i)) return;
  if (Q.phase === "red") {
    Q.out.push(i); S.teams[i].score -= FOUL; save(); sound.foul();
    laneState(i, `Falstart · −${FOUL}`, "foul"); $$(".lane .sc")[i].textContent = S.teams[i].score; lanes();
    if (Q.out.length >= S.teams.length) reveal(null, "Hamma jamoa falstart qildi");
    return;
  }
  if (Q.phase !== "green") return;
  Q.timers.forEach(clearTimeout); Q.timers = [];
  Q.phase = "answer"; Q.who = i; sound.buzz(); lanes();
  lamps(false, true, false); $("#st").textContent = "Javob"; $("#st").className = "state";
  $$(".lane").forEach((l, k) => l.classList.toggle("win", k === i));
  laneState(i, "Javob bermoqda");
  $("#react").innerHTML = `<b style="color:var(--t${S.teams[i].c})">${esc(S.teams[i].name)}</b> javob beradi — variantni tanlang (A, B, C, D)`;
  $("#qc").classList.remove("armed");
  $$(".opt").forEach((b, k) => b.disabled = Q.wrongOpts.includes(k));
  Q.t = G.timer($("#tm"), ANSWER, () => answer(-1));
}

function answer(k) {
  if (!Q || Q.phase !== "answer") return;
  Q.t.stop(); $("#tm").innerHTML = "";
  const i = Q.who, ok = k === Q.right;
  $$(".opt").forEach(b => b.disabled = true);
  if (ok) {
    S.teams[i].score += Q.value; save(); sound.ok();
    $$(".opt")[k].classList.add("right");
    return reveal(i);
  }
  if (k >= 0) { $$(".opt")[k].classList.add("wrong"); Q.wrongOpts.push(k); }
  S.teams[i].score -= Q.value / 2; Q.out.push(i); save(); sound.bad();
  laneState(i, k < 0 ? `Vaqt tugadi · −${Q.value / 2}` : `Xato · −${Q.value / 2}`, "foul");
  $$(".lane .sc")[i].textContent = S.teams[i].score;
  $$(".lane").forEach(l => l.classList.remove("win"));
  if (Q.out.length >= S.teams.length || Q.wrongOpts.length >= 3) return reveal(null, "Hech kim topa olmadi");
  Q.phase = "read"; lamps(false, false, false); $("#st").textContent = ""; lanes();
  $("#react").textContent = "Qolgan jamoalar uchun svetofor qayta yonadi…";
  later(arm, 1800);
}

function reveal(winner, why) {
  stop(); Q.phase = "done"; lamps(false, false, false); lanes();
  $$(".opt").forEach(b => b.disabled = true); $$(".opt")[Q.right].classList.add("right");
  $("#st").textContent = ""; $("#tm").innerHTML = "";
  $("#after").innerHTML = `<div class="verdict ${winner !== null ? "ok" : "bad"}">${icon(winner !== null ? "check" : "cross")} ${winner !== null ? esc(S.teams[winner].name) + ": +" + Q.value : why || "Javob koʻrsatildi"}</div>${Q.item.izoh ? `<div class="izoh">${Q.item.izoh}</div>` : ""}`;
  $(".ctrl").innerHTML = `<span class="react"></span><button class="btn primary lg" id="next" type="button">${S.idx + 1 >= S.list.length ? "Natijalar" : "Keyingi savol"} ${icon("arrow")}</button>`;
  if (winner !== null) $$(".lane .sc")[winner].textContent = S.teams[winner].score;
  S.idx++; save(); G.swapped();
  $("#next").onclick = () => render();
}

// Klaviatura faqat boshlovchi uchun: probel — svetoforni yoqish, A–D — javob varianti
document.addEventListener("keydown", e => {
  if (e.repeat || !Q || G.$(".modal.open") || e.target.closest("input")) return;
  const key = e.key.toUpperCase();
  if (Q.phase === "answer") { let k = "ABCD".indexOf(key); if (k < 0) k = "1234".indexOf(key); if (k >= 0 && !$$(".opt")[k].disabled) answer(k); }
  if (e.key === " " && Q.phase === "read" && $("#arm") && !$("#arm").disabled) { e.preventDefault(); arm(); }
});

// Ishga tushirish — barcha funksiya va oʻzgaruvchilar eʼlon qilingandan keyin
S && S.teams ? render() : setup();
</script>
</body>
</html>
