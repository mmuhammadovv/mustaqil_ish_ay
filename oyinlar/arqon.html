<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arqon tortish</title>
<script src="assets/boot.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .arena { padding: 8px 10px; }
  .arena svg { width: 100%; height: auto; max-height: 30vh; display: block; }
  .rope-g { transition: transform .8s cubic-bezier(.3,1.4,.5,1); }
  .duel { display: grid; grid-template-columns: 220px minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
  .side { padding: 18px; border-top: 6px solid var(--c); transition: opacity .2s, box-shadow .2s; }
  .side .nm { font-family: var(--display); font-size: clamp(20px, 2.2vw, 28px); line-height: 1.1; }
  .side .ct { font-family: var(--num); font-size: 40px; font-weight: 600; margin-top: 8px; }
  .side .lb { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .side .now { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--c); min-height: 1.4em; }
  .side.wait { opacity: .45; }
  .side.turn { box-shadow: 0 0 0 2px var(--c); }
  .qbox { padding: clamp(16px, 2.6vw, 28px); }
  .qbox .q-text { margin-top: 8px; }
  .nextbar { display: flex; justify-content: flex-end; margin-top: 14px; }
  @media (max-width: 960px) { .duel { grid-template-columns: 1fr 1fr; } .qbox { grid-column: 1 / -1; order: 3; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="savollar/akademik.js"></script>
<script src="savollar/tarix.js"></script>
<script src="assets/core.js"></script>
<script>
const { $, $$, esc, store, data, icon, sound } = G;
const SK = G.saveKey("arqon"), TIME = 30;
let S = store.get(SK);

G.header("Arqon tortish", reset);

function setup() {
  let target = 4;
  G.setup($("#app"), {
    kicker: "Oʻyin 05 · Duel",
    title: "Arqon tortish",
    desc: "Ikki jamoa navbatma-navbat savollarga javob beradi. Har toʻgʻri javob arqonni bir qadam oʻz tomoningizga tortadi.",
    min: 2, max: 2, def: 2,
    extra: `<span class="l">Gʻalaba uchun qadamlar</span>
      <div class="seg" id="tg">${[3, 4, 5, 6].map(n => `<button type="button" data-t="${n}" class="${n === target ? "on" : ""}">${n}</button>`).join("")}</div>`,
    rules: [
      "Oʻyin ikki jamoa oʻrtasida oʻtadi. Jamoalar <b>navbat bilan</b> javob beradi: avval chap jamoa, keyin oʻng jamoa va hokazo.",
      `Navbatdagi jamoa savolni oʻqiydi va ${TIME} soniyada 4 ta variantdan birini tanlaydi.`,
      "Toʻgʻri javob — arqon <b>bir qadam</b> shu jamoa tomonga tortiladi. Xato javob — arqon joyida qoladi.",
      "Bayroqni oʻz chizigʻigacha tortib kelgan jamoa gʻolib.",
      "Savollar oson boshlanib, asta-sekin qiyinlashadi."
    ],
    onStart(teams) {
      const order = [1, 2, 3, 4, 5].flatMap(lv => G.shuffle(G.all().filter(x => x.li + 1 === lv))).map(x => x.id);
      S = { teams, target, pos: 0, order, idx: 0 }; save(); render();
    }
  });
  $$("#tg button").forEach(b => b.onclick = () => { target = +b.dataset.t; $$("#tg button").forEach(x => x.classList.toggle("on", x === b)); });
}
function save() { store.set(SK, S); }
function reset() { store.del(SK); S = null; G.modal.close(); setup(); }

function figure(x, dir, c) {
  const lean = dir * -14;
  return `<g stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="${x + lean}" cy="92" r="11" fill="${c}" stroke="none"/>
    <path d="M${x + lean} 104 L${x} 140 M${x} 140 L${x - dir * 16} 172 M${x} 140 L${x + dir * 10} 172 M${x + lean * .6} 116 L${x + dir * 26} 128"/></g>`;
}

function arena() {
  const step = 380 / S.target, off = S.pos * step;
  const c0 = `var(--t${S.teams[0].c})`, c1 = `var(--t${S.teams[1].c})`;
  const ticks = Array.from({ length: S.target * 2 + 1 }, (_, k) => { const x = 500 + (k - S.target) * step; return `<line x1="${x}" y1="182" x2="${x}" y2="${k === S.target ? 196 : 190}" stroke="var(--line-strong)" stroke-width="${k === S.target ? 2 : 1}"/>`; }).join("");
  return `<svg viewBox="0 0 1000 200" role="img" aria-label="Arqon holati">
    <rect x="0" y="0" width="120" height="180" fill="${c0}" opacity=".08"/><rect x="880" y="0" width="120" height="180" fill="${c1}" opacity=".08"/>
    <line x1="120" y1="20" x2="120" y2="180" stroke="${c0}" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="880" y1="20" x2="880" y2="180" stroke="${c1}" stroke-width="3" stroke-dasharray="6 6"/>
    <line x1="0" y1="182" x2="1000" y2="182" stroke="var(--line-strong)" stroke-width="1.5"/>${ticks}
    <g class="rope-g" style="transform:translateX(${off}px)">
      <path d="M40 128 Q 270 136 500 128 T 960 128" fill="none" stroke="var(--accent-2)" stroke-width="7" stroke-linecap="round"/>
      <path d="M40 128 Q 270 136 500 128 T 960 128" fill="none" stroke="var(--surface)" stroke-width="2" stroke-dasharray="3 9" opacity=".7"/>
      <line x1="500" y1="128" x2="500" y2="62" stroke="var(--ink)" stroke-width="3"/>
      <path d="M500 62 L540 74 L500 86 Z" fill="var(--accent)"/>
      ${figure(70, -1, c0)}${figure(130, -1, c0)}${figure(870, 1, c1)}${figure(930, 1, c1)}
    </g>
  </svg>`;
}

const over = () => Math.abs(S.pos) >= S.target || S.idx >= S.order.length;

function render() {
  G.swapped();
  if (over()) return finishGame();
  const who = S.idx % 2, t = S.teams[who];
  const [ci, li] = S.order[S.idx].split("-").map(Number), item = data.kategoriyalar[ci].savollar[li];
  const side = s => `<div class="panel side ${s === who ? "turn" : "wait"}" style="--c:${G.tc(S.teams[s])}">
      <div class="nm">${esc(S.teams[s].name)}</div><div class="ct">${S.teams[s].score}</div><div class="lb">toʻgʻri javob</div>
      <div class="now">${s === who ? "Navbat shu jamoada" : "Kutmoqda"}</div></div>`;
  $("#app").innerHTML = `
    <div class="panel arena">${arena()}</div>
    <div class="duel">
      ${side(0)}
      <div class="panel qbox">
        <div class="meta" style="--c:${G.tc(t)}"><span class="tm-name">${esc(t.name)}</span><span>Savol ${S.idx + 1}</span><span>${esc(data.kategoriyalar[ci].nomi)}</span><span class="acc">${li + 1}-daraja</span></div>
        <div id="q"></div>
        <div class="nextbar" id="nx"></div>
      </div>
      ${side(1)}
    </div>`;
  G.ask($("#q"), item, { time: TIME, onResult(ok) {
    if (ok) { t.score++; S.pos += who === 0 ? -1 : 1; }
    S.idx++; save();
    $(".rope-g").style.transform = `translateX(${S.pos * 380 / S.target}px)`;
    $$(".side .ct")[who].textContent = t.score;
    $$(".side .now")[who].textContent = ok ? "Arqon tortildi" : "Arqon joyida qoldi";
    $("#nx").innerHTML = `<button class="btn primary lg" id="next" type="button">${over() ? "Natija" : "Keyingi savol"} ${icon("arrow")}</button>`;
    G.swapped();
    $("#next").onclick = render;
  }});
}

function finishGame() {
  // arqon holati = toʻgʻri javoblar farqi, shuning uchun gʻolib toʻgʻri javoblar soni boʻyicha aniqlanadi
  G.winner(S.teams, reset, "toʻgʻri javob");
  if (S.pos !== 0) G.$(".win .sub").textContent = Math.abs(S.pos) >= S.target ? "Arqonni oʻz chizigʻigacha tortib keldi" : "Savollar tugadi — arqon shu jamoa tomonida";
}

// Ishga tushirish — barcha funksiya va oʻzgaruvchilar eʼlon qilingandan keyin
S && S.teams ? render() : setup();
</script>
</body>
</html>
