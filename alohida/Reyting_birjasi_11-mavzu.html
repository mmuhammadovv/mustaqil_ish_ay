<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reyting birjasi — 11-mavzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root { --bg: #0f1012; --panel: #18191c; --cell: #26272b; --cell2: #1f2023; --ch: #f2efe6; --line: #000; --muted: #8b8b8b; --amber: #f2b632; --up: #4fae6a; --dn: #e0563f; --eq: #9aa3ad; --edge: #2c2d31; }
  [data-theme="light"] { --bg: #d9dcdf; --panel: #eceef0; --cell: #fbfbfa; --cell2: #f1f1ee; --ch: #1b1c1e; --line: #c9cbcd; --muted: #5d6166; --amber: #b47b00; --up: #2f7d4a; --dn: #b8402c; --eq: #5d6166; --edge: #c4c7ca; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ch); font-family: "Barlow Condensed", "Arial Narrow", sans-serif; min-height: 100vh; transition: background .4s, color .4s; }
  header { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; padding: 16px 20px 6px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 700 22px "Barlow Condensed", sans-serif; letter-spacing: .14em; }
  .logo i { width: 12px; height: 12px; background: var(--amber); border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 25%, transparent); }
  .logo small { font-weight: 500; color: var(--muted); letter-spacing: .1em; font-size: 15px; }
  header .sp { flex: 1; }
  .clock { font: 700 18px "Roboto Mono", monospace; color: var(--amber); }
  .hb { font: 600 14px "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ch); background: var(--panel); border: 1px solid var(--edge); padding: 7px 14px; cursor: pointer; }
  .hb:hover { border-color: var(--amber); }
  main { max-width: 1280px; margin: 0 auto; padding: 6px 20px 30px; }

  /* Split-flap */
  .fl { display: inline-flex; gap: 3px; vertical-align: middle; }
  .f { position: relative; display: inline-grid; place-items: center; width: var(--w, 26px); height: var(--h, 40px); border-radius: 4px; background: linear-gradient(var(--cell) 50%, var(--cell2) 50%); color: var(--ch); font: 700 var(--fs, 24px) "Roboto Mono", monospace; perspective: 200px; box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4); overflow: hidden; }
  .f::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); opacity: .9; }
  .f b { display: block; font-weight: 700; transform-origin: 50% 50%; }
  .f.go b { animation: flip .09s linear; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }
  .f.up { color: var(--up); } .f.dn { color: var(--dn); } .f.eq { color: var(--eq); } .f.am { color: var(--amber); }

  .board { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 18px 20px 20px; box-shadow: 0 20px 40px rgba(0,0,0,.35); }
  .bh { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .bh h1 { margin: 0; font: 700 30px "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .bh span { color: var(--muted); font-size: 18px; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-items: center; }
  .k { font: 600 14px "Barlow Condensed", sans-serif; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .big { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--edge); }
  .big > div { display: flex; flex-direction: column; gap: 6px; }
  .big .f { --w: 46px; --h: 70px; --fs: 44px; }
  #fc { display: flex; align-items: center; gap: 8px; height: 70px; }
  .arrow { font: 700 64px/70px "Roboto Mono", monospace; width: 70px; text-align: center; }
  .ticker { margin-top: 18px; overflow: hidden; white-space: nowrap; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); padding: 8px 0; font: 500 20px "Barlow Condensed", sans-serif; color: var(--amber); min-height: 44px; }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 16s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }

  .bets { margin-top: 18px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 170px auto 1fr auto auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 14px; transition: border-color .3s, transform .3s; }
  .row .nm { font: 700 22px "Barlow Condensed", sans-serif; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bal .f { --w: 22px; --h: 34px; --fs: 20px; }
  .ch { display: flex; gap: 8px; flex-wrap: wrap; }
  .ch button, .stk button { font: 700 17px "Barlow Condensed", sans-serif; letter-spacing: .08em; padding: 9px 14px; border: 1px solid var(--edge); background: var(--bg); color: var(--ch); border-radius: 6px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .ch button[data-v="up"].on { background: var(--up); border-color: var(--up); color: #fff; }
  .ch button[data-v="dn"].on { background: var(--dn); border-color: var(--dn); color: #fff; }
  .ch button[data-v="eq"].on { background: var(--eq); border-color: var(--eq); color: #fff; }
  .ch button:hover, .stk button:hover { border-color: var(--amber); }
  .ch button:disabled, .stk button:disabled { cursor: default; opacity: .55; }
  .stk { display: flex; gap: 6px; } .stk button.on { background: var(--amber); border-color: var(--amber); color: #111; }
  .row .res { font: 700 22px "Roboto Mono", monospace; min-width: 90px; text-align: right; }
  .row.win { border-color: var(--up); } .row.lose { border-color: var(--dn); }
  .res.p { color: var(--up); } .res.m { color: var(--dn); }
  .ctl { display: flex; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .bar { flex: 1; min-width: 200px; height: 8px; background: var(--edge); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber); transform-origin: left; }
  .sec { font: 700 22px "Roboto Mono", monospace; color: var(--amber); min-width: 46px; }
  .btn { font: 700 18px "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; background: var(--amber); color: #111; border: 0; border-radius: 6px; padding: 12px 26px; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ch); border: 1px solid var(--edge); }

  .setup { max-width: 760px; margin: 20px auto; }
  .setup p, .setup li { font-size: 19px; line-height: 1.4; color: var(--ch); }
  .setup ul { padding-left: 20px; } .setup li { margin-bottom: 6px; } .setup b { color: var(--amber); font-weight: 600; }
  .setup label { display: block; font: 600 14px "Barlow Condensed", sans-serif; letter-spacing: .2em; color: var(--muted); margin: 16px 0 6px; text-transform: uppercase; }
  .setup input { width: 100%; font: 700 18px "Roboto Mono", monospace; padding: 10px 12px; background: var(--bg); color: var(--ch); border: 1px solid var(--edge); border-radius: 6px; margin-bottom: 8px; text-transform: uppercase; }
  .seg { display: flex; gap: 8px; } .seg button { flex: 1; font: 700 20px "Roboto Mono", monospace; padding: 10px; background: var(--bg); color: var(--ch); border: 1px solid var(--edge); border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--amber); color: #111; border-color: var(--amber); }
  .final .row { grid-template-columns: 60px 1fr auto; }
  @media (max-width: 820px) { header { flex-wrap: wrap; padding: 12px 16px 6px; } .clock { display: none; } .hb { padding: 6px 10px; font-size: 12px; } main { padding: 6px 12px 24px; } #fc { height: 50px; } .row { grid-template-columns: 1fr auto auto; } .row .ch, .row .stk { grid-column: 1 / -1; } .big .f { --w: 32px; --h: 50px; --fs: 30px; } .arrow { font-size: 44px; line-height: 50px; width: 50px; } .grid { grid-template-columns: 1fr; gap: 4px; } .grid .f { --w: 11px; --h: 24px; --fs: 12px; } .grid .fl { gap: 2px; } .bh h1 { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>REYTING BIRJASI <small>11-MAVZU</small></div>
  <span class="sp"></span><span class="clock" id="clk"></span>
  <button class="hb" id="thm" type="button">Kunduzgi</button>
  <button class="hb" id="rst" type="button">Yangi oʻyin</button>
</header>
<main id="app"></main>
<script>
// Oʻzbekistonning oʻrni: oldingi → yangi (11-mavzu maʼruzasi maʼlumotlari)
const DATA = [
  { n: "ELEKTRON HUKUMAT", o: "BMT", y: "2024", a: 69, b: 63, t: 193, z: "6 pogʻona yuqoriga: Oʻzbekiston “juda yuqori” (Very High EGDI) guruhiga kirdi" },
  { n: "IQTISODIY ERKINLIK", o: "HERITAGE FOUNDATION", y: "2025", a: 103, b: 100, t: 184, z: "58 ball (+2,1). 12 koʻrsatkichdan 8 tasi yaxshilandi, lekin hali “erkin boʻlmagan” toifada" },
  { n: "MATBUOT ERKINLIGI", o: "CHEGARA BILMAS MUXBIRLAR", y: "2025", a: 148, b: 148, t: 180, z: "Oʻrin saqlandi, ammo ball 37 dan (2023) 35 ga tushdi — holat “juda jiddiy”" },
  { n: "INSON TARAQQIYOTI", o: "BMTTD", y: "2025", a: 106, b: 107, t: 193, z: "1 pogʻona pastga. Indeks 0,740 — “yuqori” guruh; mintaqada “juda yuqori” faqat Qozogʻiston" },
  { n: "KORRUPSIYANI QABUL QILISH", o: "TRANSPARENCY INTERNATIONAL", y: "2024", a: 121, b: 121, t: 180, z: "Oʻrin oʻzgarmadi, ball 33 dan 32 ga — 2012-yildan beri ilk yomonlashuv" },
  { n: "LOGISTIKA SAMARADORLIGI", o: "JAHON BANKI", y: "2025", a: 88, b: 107, t: 139, z: "19 pogʻona pastga, ball 2,6 dan 2,5 ga: bojxona, transport, yetkazib berish" },
  { n: "QONUN USTUVORLIGI", o: "WORLD JUSTICE PROJECT", y: "2024", a: 78, b: 83, t: 142, z: "5 pogʻona pastga — 2016-yildan beri ilk salbiy oʻzgarish; faqat xavfsizlik va tartib oʻsdi" },
  { n: "AYOLLAR, BIZNES VA QONUN", o: "JAHON BANKI", y: "2023", a: 139, b: 91, t: 190, z: "Birdaniga 48 pogʻona yuqoriga — eng koʻp islohot qilgan 5 davlat qatorida, 82,5 ball" },
  { n: "GLOBAL INNOVATSIYALAR", o: "WIPO", y: "2024", a: 82, b: 83, t: 133, z: "1 pogʻona pastga, ball 26,2 dan 24,7 ga. Indeks 2007-yildan beri hisoblanadi" },
  { n: "STATISTIKA SAMARADORLIGI", o: "JAHON BANKI", y: "2023", a: 79, b: 62, t: 217, z: "17 pogʻona yuqoriga, 80,3 ball. Yetti yilda jami 89 pogʻona yaxshilandi" },
  { n: "BARQAROR RIVOJLANISH", o: "BMT SDSN", y: "—", a: 69, b: 81, t: null, z: "12 pogʻona pastga, 69,2 ball" },
  { n: "DEMOKRATIYA INDEKSI", o: "ECONOMIST INTELLIGENCE UNIT", y: "2025", a: 148, b: 146, t: null, z: "Ball 2,12 dan 2,10 ga tushdi, lekin boshqalar koʻproq tushgani uchun 2 pogʻona yuqoriga!" },
  { n: "SANOAT RAQOBATBARDOSHLIGI", o: "UNIDO", y: "—", a: 89, b: 88, t: null, z: "1 pogʻona yuqoriga — 88-oʻrin" },
];
const ROUNDS = 10, TIME = 30, START = 1000, STAKES = [100, 200, 300];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
let AC; const tone = (f, d = .03, t = "square", v = .03, w = 0) => { try { AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + w; o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.001, s + d); o.connect(g).connect(AC.destination); o.start(s); o.stop(s + d); } catch (e) {} };
$("#thm").onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark"; $("#thm").textContent = h.dataset.theme === "dark" ? "Kunduzgi" : "Tungi"; };
$("#rst").onclick = () => { if (!S || confirm("Yangi oʻyin boshlansinmi?")) { stop(); S = null; setup(); } };
setInterval(() => { const d = new Date(); $("#clk").textContent = d.toTimeString().slice(0, 8); }, 1000);

// split-flap: matnni katakchalarga yozadi va har harfni tasodifiy belgilar orqali "aylantirib" keladi
const cells = (len, cls = "") => `<span class="fl">${Array.from({ length: len }, () => `<span class="f ${cls}"><b>&nbsp;</b></span>`).join("")}</span>`;
function flap(host, text, { len, cls = "", spin = 8, pad = "end" } = {}) {
  const s = String(text).toUpperCase(); len = len || s.length;
  const t = pad === "start" ? s.padStart(len) : s.padEnd(len);
  host.innerHTML = cells(len, cls);
  [...host.querySelectorAll(".f")].forEach((c, i) => {
    const fin = t[i] || " ", n = fin === " " ? 0 : spin + (i % 5) * 2; let k = 0;
    const step = () => {
      const ch = k < n ? CH[Math.random() * CH.length | 0] : fin;
      c.firstChild.textContent = ch === " " ? " " : ch; c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
      if (k++ < n) { if (i % 3 === 0) tone(1800 + Math.random() * 400, .015, "square", .012); setTimeout(step, 45); }
    };
    setTimeout(step, i * 25);
  });
}

let S = null, T = null;
function setup() {
  let n = 2;
  $("#app").innerHTML = `<div class="board setup"><div class="bh"><h1>Reyting birjasi</h1><span>Oʻzbekiston xalqaro reytinglarda</span></div>
    <ul><li>Tablo indeks nomini, tuzuvchisini va Oʻzbekistonning <b>oldingi oʻrnini</b> koʻrsatadi.</li>
    <li>Har bir jamoa ${TIME} soniyada tikadi: oʻrin <b>KOʻTARILDI</b>, <b>TUSHDI</b> yoki <b>OʻZGARMADI</b> — va qancha ball tikishini tanlaydi (100 / 200 / 300).</li>
    <li>Tablo yangi oʻrinni ochadi. Topgan jamoa tikkanini oladi (OʻZGARMADI toʻgʻri boʻlsa — ikki baravar), topmagan jamoa tikkanini yoʻqotadi.</li>
    <li>Har jamoada boshida ${START} ball. ${ROUNDS} ta raund.</li></ul>
    <label>Jamoalar soni</label><div class="seg" id="ns">${[2, 3, 4].map(k => `<button type="button" data-n="${k}" class="${k === n ? "on" : ""}">${k}</button>`).join("")}</div>
    <label>Jamoalar nomi</label><div id="nm"></div>
    <div class="ctl"><span class="sp" style="flex:1"></span><button class="btn" id="go" type="button">Savdoni ochish</button></div></div>`;
  const names = () => { $("#nm").innerHTML = Array.from({ length: n }, (_, i) => `<input maxlength="12" value="${i + 1}-JAMOA">`).join(""); };
  names();
  $$("#ns button").forEach(b => b.onclick = () => { n = +b.dataset.n; $$("#ns button").forEach(x => x.classList.toggle("on", x === b)); names(); });
  $("#go").onclick = () => {
    S = { teams: $$("#nm input").map((x, i) => ({ name: x.value.trim().toUpperCase() || `${i + 1}-JAMOA`, bal: START })), order: shuffle(DATA).slice(0, ROUNDS), r: 0 };
    round();
  };
}
function round() {
  if (S.r >= S.order.length) return finish();
  const d = S.order[S.r]; S.bets = S.teams.map(() => ({ v: null, s: 100 })); S.open = false;
  $("#app").innerHTML = `<div class="board"><div class="bh"><h1>Raund ${S.r + 1} / ${S.order.length}</h1><span>Oʻzbekistonning oʻrni qanday oʻzgardi?</span></div>
    <div class="grid"><span class="k">Indeks</span><span id="fn"></span><span class="k">Tuzuvchi</span><span id="fo"></span><span class="k">Yil</span><span id="fy"></span></div>
    <div class="big"><div><span class="k">Oldingi oʻrin</span><span id="fa"></span></div><div><span class="k">Yangi oʻrin</span><span id="fb"></span></div><div><span class="k">Oʻzgarish</span><span id="fc"></span></div>${d.t ? `<div><span class="k">Jami davlat</span><span id="ft"></span></div>` : ""}</div>
    <div class="ticker" id="tk"></div></div>
    <div class="bets">${S.teams.map((t, i) => `<div class="row" data-i="${i}"><span class="nm">${esc(t.name)}</span><span class="bal" id="bal${i}"></span>
      <span class="ch">${[["up", "▲ KOʻTARILDI"], ["eq", "= OʻZGARMADI"], ["dn", "▼ TUSHDI"]].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("")}</span>
      <span class="stk">${STAKES.map(s => `<button type="button" data-s="${s}" class="${s === 100 ? "on" : ""}">${s}</button>`).join("")}</span></div>`).join("")}</div>
    <div class="ctl"><span class="sec" id="sec">${TIME}</span><span class="bar"><i id="bar"></i></span><button class="btn" id="open" type="button">Ochish</button></div>`;
  const wide = innerWidth > 820;
  flap($("#fn"), d.n, { len: wide ? 26 : d.n.length }); flap($("#fo"), d.o, { len: wide ? 27 : d.o.length, spin: 5 }); flap($("#fy"), d.y, { len: 4, cls: "am" });
  flap($("#fa"), d.a, { len: 3, pad: "start" }); flap($("#fb"), "???", { len: 3, cls: "am", spin: 3 }); $("#fc").innerHTML = cells(1); if (d.t) flap($("#ft"), d.t, { len: 3, pad: "start", spin: 4 });
  S.teams.forEach((t, i) => flap($("#bal" + i), t.bal, { len: 5, pad: "start", spin: 3 }));
  $$(".row").forEach(row => {
    const i = +row.dataset.i;
    row.querySelectorAll(".ch button").forEach(b => b.onclick = () => { if (S.open) return; S.bets[i].v = b.dataset.v; row.querySelectorAll(".ch button").forEach(x => x.classList.toggle("on", x === b)); tone(900, .05, "triangle", .08); });
    row.querySelectorAll(".stk button").forEach(b => b.onclick = () => { if (S.open) return; S.bets[i].s = +b.dataset.s; row.querySelectorAll(".stk button").forEach(x => x.classList.toggle("on", x === b)); });
  });
  $("#open").onclick = reveal;
  timer();
}
function timer() {
  stop(); const t0 = performance.now();
  (function f(now) {
    if (!$("#bar")) return;
    const left = Math.max(0, TIME - (now - t0) / 1000);
    $("#bar").style.transform = `scaleX(${left / TIME})`; $("#sec").textContent = Math.ceil(left);
    if (left <= 0) return reveal();
    T = requestAnimationFrame(f);
  })(t0);
}
function stop() { if (T) cancelAnimationFrame(T); T = null; }
function reveal() {
  if (S.open) return; S.open = true; stop();
  const d = S.order[S.r], diff = d.a - d.b, v = diff > 0 ? "up" : diff < 0 ? "dn" : "eq";
  flap($("#fb"), d.b, { len: 3, pad: "start", spin: 14, cls: v === "up" ? "up" : v === "dn" ? "dn" : "eq" });
  setTimeout(() => {
    $("#fc").innerHTML = `<span class="arrow" style="color:var(--${v})">${v === "up" ? "▲" : v === "dn" ? "▼" : "="}</span>${v === "eq" ? "" : `<span class="fl-h"></span>`}`;
    if (v !== "eq") { const h = $("#fc .fl-h"); flap(h, Math.abs(diff), { len: 2, pad: "start", cls: v, spin: 6 }); }
    $("#tk").innerHTML = `<span>${esc(d.z)}   ·   ${esc(d.n)}</span>`;
    $$(".row").forEach(row => {
      const i = +row.dataset.i, b = S.bets[i]; row.querySelectorAll("button").forEach(x => x.disabled = true);
      let delta = 0; if (b.v) delta = b.v === v ? b.s * (v === "eq" ? 2 : 1) : -b.s;
      S.teams[i].bal += delta; row.classList.add(delta > 0 ? "win" : delta < 0 ? "lose" : "x");
      row.insertAdjacentHTML("beforeend", `<span class="res ${delta > 0 ? "p" : delta < 0 ? "m" : ""}">${delta > 0 ? "+" : ""}${delta || "0"}</span>`);
      flap($("#bal" + i), S.teams[i].bal, { len: 5, pad: "start", spin: 6, cls: delta > 0 ? "up" : delta < 0 ? "dn" : "" });
    });
    tone(v === "dn" ? 300 : 700, .25, "triangle", .12);
    const o = $("#open"); o.textContent = S.r + 1 >= S.order.length ? "Natijalar" : "Keyingi raund"; o.disabled = true;
    setTimeout(() => { o.disabled = false; o.onclick = () => { S.r++; round(); }; }, 900);
  }, 1100);
}
function finish() {
  stop(); const r = S.teams.slice().sort((a, b) => b.bal - a.bal);
  $("#app").innerHTML = `<div class="board final"><div class="bh"><h1>Savdo yopildi</h1><span>Yakuniy hisob</span></div>
    <div class="bets">${r.map((t, k) => `<div class="row ${k === 0 ? "win" : ""}"><span class="nm">${k + 1}</span><span class="nm">${esc(t.name)}</span><span class="bal" id="fb${k}"></span></div>`).join("")}</div>
    <div class="ctl"><span style="flex:1"></span><button class="btn" id="again" type="button">Yana oʻynash</button></div></div>`;
  r.forEach((t, k) => flap($("#fb" + k), t.bal, { len: 5, pad: "start", spin: 10, cls: k === 0 ? "am" : "" }));
  $("#again").onclick = () => { S = null; setup(); };
}
setup();
</script>
</body>
</html>
