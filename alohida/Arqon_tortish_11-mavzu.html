<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root {
    --A: #2c5b8c; --A2: #1d3f66; --B: #c4512f; --B2: #8e3217;
    --s1: #8fc9e0; --s2: #f8e7c4; --sun: #ffcf5a; --stars: 0; --rays: .35; --mt: #9bb4c4; --d1: #edc17e; --d2: #e0a965; --d3: #cf914d; --gr: #e9c891; --gr2: #d8ad6c;
    --page: #f4ead8; --card: #fffdf8; --ink: #2a2118; --muted: #7c6a55; --line: #e6d7bd; --good: #3c8f5a; --bad: #c4402f; --shadow: 0 14px 34px rgba(90,60,20,.14);
  }
  [data-theme="dark"] {
    --s1: #0d1736; --s2: #2c3562; --sun: #f4efd8; --stars: 1; --rays: 0; --mt: #2b3a5c; --d1: #6b5a4a; --d2: #5a4a3d; --d3: #4a3c32; --gr: #6e5b45; --gr2: #5b4a38;
    --page: #151a2b; --card: #1f2539; --ink: #f2ead9; --muted: #a9a08e; --line: #343b55; --good: #6fcf8f; --bad: #ff7b66; --A: #5b8fd0; --B: #e2734f; --shadow: 0 14px 34px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: "Manrope", "Segoe UI", system-ui, sans-serif; transition: background .5s, color .5s; }
  header { display: flex; align-items: center; gap: 10px; max-width: 1240px; margin: 0 auto; padding: 16px 20px 10px; }
  header .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--ink); }
  header .t { line-height: 1.15; } header .t b { font: 800 20px "Unbounded", system-ui, sans-serif; display: block; } header .t small { color: var(--muted); font-weight: 700; font-size: 12px; }
  header .sp { flex: 1; }
  .hb { font: 700 13px "Manrope", sans-serif; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: border-color .2s, transform .2s; }
  .hb:hover { border-color: var(--ink); transform: translateY(-1px); }
  main { max-width: 1240px; margin: 0 auto; padding: 0 20px 30px; }

  /* ===== Rasm-sahna ===== */
  .scene { position: relative; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); background: var(--s1); }
  .scene svg { display: block; width: 100%; height: auto; }
  .grp { transition: transform 1.2s cubic-bezier(.34, 1.45, .5, 1); }
  .grp.tense { animation: tense .22s linear infinite; }
  @keyframes tense { 50% { translate: 1.5px 0; } }
  .team.heave .tor { animation: heave .9s ease; }
  .team.stumble .tor { animation: stumble .9s ease; }
  @keyframes heave { 35% { transform: rotate(-14deg); } }
  @keyframes stumble { 35% { transform: rotate(16deg); } }
  .dust circle { opacity: 0; }
  .team.heave .dust circle { animation: dust 1s ease-out; }
  @keyframes dust { 10% { opacity: .7; } 100% { opacity: 0; transform: translate(-26px, -16px) scale(2.2); } }
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
  .rays { opacity: var(--rays); transition: opacity .6s; transform-origin: 830px 92px; animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bird { animation: fly 24s linear infinite; }
  @keyframes fly { from { transform: translate(-80px, 0); } to { transform: translate(1100px, -40px); } }
  .tw { animation: twk 3s ease-in-out infinite; } @keyframes twk { 50% { opacity: .25; } }
  .stars { opacity: var(--stars); transition: opacity .6s; }
  .flagc { animation: flg 1.6s ease-in-out infinite alternate; transform-origin: 500px 225px; }
  @keyframes flg { to { transform: skewX(8deg); } }
  .mk { transition: fill .5s; }

  .sc { position: absolute; top: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px; background: var(--card); box-shadow: 0 6px 16px rgba(0,0,0,.14); transition: transform .3s, box-shadow .3s; max-width: 42%; }
  .sc.l { left: 14px; } .sc.r { right: 14px; flex-direction: row-reverse; padding: 8px 8px 8px 14px; text-align: right; }
  .sc > span:last-child { min-width: 0; }
  .sc .n { display: grid; place-items: center; min-width: 46px; height: 46px; border-radius: 12px; background: var(--c); color: #fff; font: 800 22px "Unbounded", sans-serif; }
  .sc b { display: block; font: 800 15px "Manrope", sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc small { color: var(--muted); font-weight: 700; font-size: 12px; }
  .sc.turn { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--c), 0 10px 22px rgba(0,0,0,.2); }
  .sc.turn small { color: var(--c); }
  .pop { position: absolute; top: 40%; font: 800 clamp(18px, 3vw, 32px) "Unbounded", sans-serif; color: #fff; padding: 6px 16px; border-radius: 14px; background: var(--c); opacity: 0; pointer-events: none; }
  .pop.go { animation: pop 1.5s ease forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(12px) scale(.7); } 20% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

  /* ===== Kartochkalar ===== */
  .card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 30px; margin-top: 18px; }
  .qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chip { font: 800 12px "Manrope", sans-serif; letter-spacing: .04em; padding: 6px 12px; border-radius: 999px; background: var(--page); color: var(--muted); }
  .chip.who { background: var(--c); color: #fff; }
  .qhead .sp { flex: 1; }
  .ring { position: relative; width: 62px; height: 62px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring em { position: absolute; inset: 0; display: grid; place-items: center; font: 800 18px "Unbounded", sans-serif; font-style: normal; }
  .ring.low em { color: var(--bad); } .ring.low .rc { stroke: var(--bad); }
  .qt { margin: 14px 0 20px; font: 700 clamp(19px, 2.2vw, 27px)/1.35 "Unbounded", sans-serif; letter-spacing: -.01em; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; font: 700 clamp(15px, 1.4vw, 17px)/1.35 "Manrope", sans-serif; color: var(--ink); background: var(--page); border: 2px solid transparent; border-radius: 16px; cursor: pointer; transition: transform .18s, border-color .2s, background .3s; }
  .opt .k { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--card); color: var(--c); font: 800 15px "Unbounded", sans-serif; border: 2px solid var(--c); }
  .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--c); }
  .opt:disabled { cursor: default; }
  .opt.right { background: color-mix(in srgb, var(--good) 18%, var(--card)); border-color: var(--good); }
  .opt.right .k { background: var(--good); border-color: var(--good); color: #fff; }
  .opt.wrong { background: color-mix(in srgb, var(--bad) 15%, var(--card)); border-color: var(--bad); animation: shake .4s; }
  .opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.dim { opacity: .45; }
  @keyframes shake { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  .foot { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin-top: 18px; min-height: 50px; }
  .verdict { font: 800 17px "Manrope", sans-serif; } .verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); }
  .izoh { color: var(--muted); font-weight: 600; font-size: 14px; flex-basis: 100%; order: 3; }
  .foot .sp { flex: 1; }
  .btn { font: 700 15px "Unbounded", sans-serif; color: var(--card); background: var(--ink); border: 0; border-radius: 14px; padding: 15px 26px; cursor: pointer; transition: transform .18s, box-shadow .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
  .in { animation: in .55s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }

  .setup { display: grid; grid-template-columns: 1.1fr 1fr; gap: 30px; }
  .setup h1 { margin: 0 0 6px; font: 800 clamp(28px, 3.4vw, 42px)/1.05 "Unbounded", sans-serif; letter-spacing: -.02em; }
  .setup .sub { color: var(--muted); font-weight: 700; margin: 0 0 18px; }
  .rules { margin: 0; padding: 0; list-style: none; counter-reset: r; }
  .rules li { counter-increment: r; display: flex; gap: 12px; padding: 9px 0; font-weight: 600; line-height: 1.4; border-top: 2px dashed var(--line); }
  .rules li::before { content: counter(r); flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--page); font: 800 13px "Unbounded", sans-serif; }
  .fld label { display: block; font-weight: 800; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .fld + .fld { margin-top: 18px; }
  .fld input { display: block; width: 100%; padding: 13px 14px 13px 16px; font: 700 16px "Manrope", sans-serif; color: var(--ink); background: var(--page); border: 2px solid transparent; border-left: 8px solid var(--c); border-radius: 12px; outline: none; }
  .fld input:focus { border-color: var(--c); }
  .fld input + input { margin-top: 10px; }
  .seg { display: flex; gap: 8px; } .seg button { flex: 1; padding: 12px 0; font: 800 17px "Unbounded", sans-serif; color: var(--ink); background: var(--page); border: 2px solid transparent; border-radius: 12px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--card); }
  .win { text-align: center; }
  .win .big { font: 800 clamp(30px, 5vw, 54px)/1.1 "Unbounded", sans-serif; color: var(--c); margin: 12px 0 6px; }
  .win p { color: var(--muted); font-weight: 700; margin: 0 0 18px; }
  .win .rows { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .win .rows div { padding: 12px 20px; border-radius: 14px; background: var(--page); font-weight: 800; border-left: 6px solid var(--c); }
  @media (max-width: 760px) { .opts, .setup { grid-template-columns: 1fr; } .card { padding: 20px 16px; } .sc { top: 8px; padding: 5px 10px 5px 5px; gap: 7px; } .sc.r { padding: 5px 5px 5px 10px; } .sc .n { min-width: 34px; height: 34px; font-size: 16px; } .sc b { font-size: 12px; } .sc small { display: none; } .scene { border-radius: 18px; } .scene svg { height: 250px; } header { flex-wrap: wrap; } header .t small { display: none; } .hb { padding: 7px 10px; font-size: 12px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

  const w = S.pos < 0 ? 0 : S.pos > 0 ? 1 : (S.score[0] === S.score[1] ? -1 : S.score[0] > S.score[1] ? 0 : 1);
  boards(S.names, S.score, w);
  if (w >= 0) { const t = $("#tm" + w); t.classList.remove("heave", "stumble"); void t.getBBox(); t.classList.add("heave"); }
  $("#app").innerHTML = `<div class="card win in" style="--c:${w < 0 ? "var(--ink)" : tc(w)}">
    <span class="chip">Oʻyin yakuni</span>
    <div class="big">${w < 0 ? "Durang" : esc(S.names[w]) + " yutdi"}</div>
    <p>${w < 0 ? "Arqon oʻrtada qoldi" : Math.abs(S.pos) >= S.target ? "Bayroqchani oʻz ustunigacha tortib keldi" : "Savollar tugadi — arqon shu jamoa tomonida"}</p>
    <div class="rows">${[0, 1].map(s => `<div style="--c:${tc(s)}">${esc(S.names[s])}: ${S.score[s]} ta toʻgʻri</div>`).join("")}</div>
    <button class="btn" id="again" type="button">Yana oʻynash</button></div>`;
  $("#again").onclick = () => { S = null; setup(); };
}
addEventListener("keydown", e => { if (done || !S || e.target.closest("input")) return; const b = $$(".opt")["ABCD".indexOf(e.key.toUpperCase())]; if (b && !b.disabled) b.click(); });
setup();
</script>
</body>
</html>
